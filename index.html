<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - Automated Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444; --warning:#ffcc00;
        }
        * { box-sizing:border-box; }
        body{
            margin:0; font-family:Segoe UI,Roboto,sans-serif;
            background:radial-gradient(circle at top,var(--bg1),var(--bg2));
            color:#fff; overflow-x: hidden;
        }
        .screen{ display:none; min-height:100vh; justify-content:center; align-items:center; padding: 20px; }
        .screen.active{ display:flex; }
        .card{
            width:100%; max-width:380px; padding:30px; border-radius:20px;
            background:var(--glass); backdrop-filter: blur(14px); text-align:center;
            box-shadow:0 0 30px rgba(0,255,255,.25); border: 1px solid rgba(255,255,255,0.1);
        }
        input, button{ width:100%; padding:14px; margin-top:15px; border:none; border-radius:12px; font-size:15px; outline: none; }
        input { background: rgba(255,255,255,0.1); color: #fff; }
        button{ background:linear-gradient(135deg,var(--accent),var(--primary)); font-weight:700; cursor:pointer; color:#000; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        
        .menu{ width:100%; max-width:600px; }
        .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top: 20px; }
        
        .lista-container { margin-top:20px; max-height:400px; overflow-y:auto; text-align:left; padding-right: 5px; }
        .item-estoque, .item-pedido { 
            padding:12px; background:rgba(255,255,255,0.05); border-radius:10px; 
            margin-bottom:8px; border-left: 4px solid var(--accent);
        }
        
        .badge-perfil {
            font-size: 10px; background: var(--accent); color: #000;
            padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 5px;
            text-transform: uppercase;
        }

        footer{ position:fixed; bottom:10px; width:100%; text-align:center; font-size:11px; color:#aaa; pointer-events: none; }
    </style>
</head>

<body>

    <!-- TELA: LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="card">
            <h2>FAST REQUEST PRO</h2>
            <p style="font-size: 12px; color: var(--accent);">Identificação de Perfil Automática</p>
            <input id="login_mat" type="text" placeholder="Matrícula">
            <input id="login_pass" type="password" placeholder="Senha">
            <button id="btn-login" onclick="login()">Entrar</button>
        </div>
    </div>

    <!-- TELA: MENU DINÂMICO (CARREGA APÓS LOGIN) -->
    <div id="screen-menu" class="screen">
        <div class="menu">
            <div id="cabecalhoUsuario">
                <h3 id="infoUsuario" style="margin-bottom:5px; text-align: center;"></h3>
                <center><span id="roleLabel" class="badge-perfil"></span></center>
            </div>
            
            <div id="menuBotoes" class="menu-grid">
                <!-- Botões injetados conforme o perfil do banco de dados -->
            </div>
            
            <button onclick="location.reload()" style="margin-top:30px; background:transparent; color:var(--danger); border:1px solid var(--danger);">Sair</button>
        </div>
    </div>

    <!-- TELA: OSM / CONSULTA -->
    <div id="screen-osm" class="screen">
        <div class="menu">
            <h3 id="tituloOSM">Consulta</h3>
            <input type="text" id="buscaMaterial" placeholder="Cód. Sap ou Descrição..." oninput="filtrarEstoque()">
            <div id="listaProdutos" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff;">Voltar ao Menu</button>
        </div>
    </div>

    <!-- TELA: PEDIDOS (APROVAÇÃO OU CONSULTA) -->
    <div id="screen-pedidos" class="screen">
        <div class="menu">
            <h3 id="tituloPedidos">Pedidos</h3>
            <div id="listaPedidosGeral" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff;">Voltar ao Menu</button>
        </div>
    </div>

    <footer>FAST REQUEST PRO • v16.1.0 • GitHub + Vercel</footer>

<script>
const GITHUB_ESTOQUE = "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/main/base_dados/MB52.XLSX";
let appState = { 
    usuario: null, 
    perfil: null, 
    dadosUsuario: null, 
    estoque: [],
    pedidosSimulados: [
        { id: 202601, solicitante: "João Silva", data: "12/05/2026", status: "PENDENTE", itens: 4 },
        { id: 202602, solicitante: "Maria Souza", data: "11/05/2026", status: "APROVADO", itens: 7 }
    ]
};

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

async function login() {
    const mat = document.getElementById('login_mat').value;
    const pass = document.getElementById('login_pass').value;
    const btn = document.getElementById('btn-login');

    if (!mat || !pass) return alert("Preencha os campos!");
    btn.innerText = "Validando...";
    btn.disabled = true;

    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario: mat, senha: pass })
        });

        const res = await response.json();

        if (res.authenticated) {
            // DADOS VINDOS DA SUA BASE
            appState.usuario = res.user.nome;
            appState.perfil = res.user.perfil.toLowerCase(); // solicitante, aprovador ou administrador
            appState.dadosUsuario = res.user;

            // Carrega Interface
            document.getElementById('infoUsuario').innerText = `Olá, ${appState.usuario}`;
            document.getElementById('roleLabel').innerText = appState.perfil;
            
            configurarMenu(appState.perfil);
            carregarEstoqueBase();
            mudarTela('screen-menu');
        } else {
            alert("Acesso negado: Matrícula ou Senha inválidos.");
            btn.innerText = "Entrar";
            btn.disabled = false;
        }
    } catch (e) {
        alert("Erro ao conectar com o servidor.");
        btn.innerText = "Entrar";
        btn.disabled = false;
    }
}

function configurarMenu(perfil) {
    const grid = document.getElementById('menuBotoes');
    grid.innerHTML = ""; 

    // Lógica de menus solicitada
    const menus = {
        solicitante: [
            { txt: "🔁 Conversor", cmd: () => alert('Conversor em breve') },
            { txt: "📋 Gerar OSM", cmd: () => abrirOSM('Gerar OSM') },
            { txt: "📆 Gerar Programada", cmd: () => alert('Programada em breve') },
            { txt: "📂 Meus Pedidos", cmd: () => abrirPedidos('Verificar Meus Pedidos') }
        ],
        aprovador: [
            { txt: "✅ Pedidos Recebidos", cmd: () => abrirPedidos('Aprovar/Recusar Pedidos') },
            { txt: "📋 Criar OSM", cmd: () => abrirOSM('Criar OSM') },
            { txt: "📆 Criar Programadas", cmd: () => alert('Programada em breve') }
        ],
        administrador: [
            { txt: "📊 Dashboard", cmd: () => alert('Painel Gestor') },
            { txt: "👥 Gestão Usuários", cmd: () => alert('Controle de Acessos') },
            { txt: "⚙️ Configurações", cmd: () => alert('Configurações do Sistema') },
            { txt: "📂 Todas Solicitações", cmd: () => abrirPedidos('Gestão Total') }
        ]
    };

    const itensMenu = menus[perfil] || [];
    itensMenu.forEach(item => {
        const b = document.createElement('button');
        b.innerText = item.txt;
        b.onclick = item.cmd;
        grid.appendChild(b);
    });
}

// FUNÇÕES DE TELA
function abrirOSM(titulo) {
    document.getElementById('tituloOSM').innerText = titulo;
    mudarTela('screen-osm');
    filtrarEstoque();
}

function abrirPedidos(titulo) {
    document.getElementById('tituloPedidos').innerText = titulo;
    const lista = document.getElementById('listaPedidosGeral');
    lista.innerHTML = "";

    appState.pedidosSimulados.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item-pedido';
        
        // Se for Aprovador, mostra botões de ação
        let acoes = "";
        if (appState.perfil === 'aprovador' && p.status === "PENDENTE") {
            acoes = `
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <button onclick="decisao(true)" style="margin:0; flex:1; background:var(--accent); color:#000; padding:8px;">Aprovar</button>
                    <button onclick="decisao(false)" style="margin:0; flex:1; background:var(--danger); color:#fff; padding:8px;">Recusar</button>
                </div>
            `;
        }

        div.innerHTML = `
            <div style="font-size:11px; color:#aaa;">REF: #${p.id}</div>
            <div style="font-weight:bold;">${p.solicitante}</div>
            <div style="font-size:13px; margin:5px 0;">Itens: ${p.itens} | Status: <span style="color:var(--accent)">${p.status}</span></div>
            ${acoes}
        `;
        lista.appendChild(div);
    });
    mudarTela('screen-pedidos');
}

function decisao(aprovado) {
    alert(aprovado ? "Solicitação Aprovada!" : "Solicitação Recusada.");
}

async function carregarEstoqueBase() {
    try {
        const response = await fetch(GITHUB_ESTOQUE + "?t=" + new Date().getTime());
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const dadosBrutos = XLSX.utils.sheet_to_json(worksheet, { range: 0 });

        appState.estoque = dadosBrutos.map(item => ({
            codigo: item["Material"],
            descricao: item["Texto breve material"],
            saldo: item["Utilização livre"],
            unidade: item["Unid.medida básica"]
        })).filter(i => i.codigo);
    } catch (e) { console.error("Erro MB52:", e); }
}

function filtrarEstoque() {
    const termo = document.getElementById('buscaMaterial').value.toLowerCase();
    const lista = document.getElementById('listaProdutos');
    lista.innerHTML = "";

    const filtrados = appState.estoque.filter(i => 
        (i.codigo && i.codigo.toString().toLowerCase().includes(termo)) || 
        (i.descricao && i.descricao.toLowerCase().includes(termo))
    );

    filtrados.slice(0, 20).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-estoque';
        div.innerHTML = `
            <div style="font-weight:bold; color:var(--accent);">${item.codigo}</div>
            <div style="font-size:13px;">${item.descricao}</div>
            <div style="font-size:12px; opacity:0.7;">Saldo: ${item.saldo} ${item.unidade}</div>
        `;
        lista.appendChild(div);
    });
}
</script>
</body>
</html>
