<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST REQUEST</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at top,#02062a,#010314);
    font-family:Segoe UI,sans-serif;
}
.login-box{
    width:360px;
    background:linear-gradient(180deg,#0b1240,#080c2b);
    padding:30px;
    border-radius:14px;
    box-shadow:0 20px 40px rgba(0,0,0,.6);
}
.login-box h2{
    text-align:center;
    color:#00ffe0;
    margin-bottom:25px;
}
.login-box input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border-radius:10px;
    border:none;
    font-size:15px;
}
.login-box button{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(90deg,#00ffe0,#0080ff);
    color:#000;
}
.screen{display:none}
.screen.active{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="scr-login" class="login-box screen active">
    <h2>FAST REQUEST</h2>
    <input id="inMat" placeholder="Matrícula">
    <input id="inPass" type="password" placeholder="Senha">
    <button onclick="Auth.login()">Entrar</button>
</div>

<!-- MENU -->
<div id="scr-menu" class="login-box screen">
    <h2 id="uiUser"></h2>
    <button onclick="Router.go('scr-osm')">Gerar OSM</button>
    <button onclick="Auth.logout()" style="margin-top:10px;background:#222;color:#fff">Logout</button>
</div>

<!-- OSM -->
<div id="scr-osm" class="login-box screen">
    <h2>Nova OSM</h2>
    <input id="osmId" placeholder="Número da OSM">
    <input id="matItem" placeholder="Material">
    <input id="qtdItem" type="number" placeholder="Quantidade">
    <button onclick="OSM.addItem()">Adicionar</button>
    <div id="cart"></div>
    <button onclick="OSM.enviar()">Confirmar</button>
    <button onclick="Router.go('scr-menu')" style="margin-top:10px;background:#222;color:#fff">Voltar</button>
</div>

<script>
const App={user:null,cart:[]};

const Auth={
    login(){
        if(!inMat.value || !inPass.value){
            alert("Informe matrícula e senha");
            return;
        }
        App.user={nome:"Usuário "+inMat.value,matricula:inMat.value};
        sessionStorage.setItem("user",JSON.stringify(App.user));
        uiUser.innerText="Olá, "+App.user.nome;
        Router.go("scr-menu");
    },
    logout(){
        sessionStorage.clear();
        location.reload();
    }
};

const OSM={
    addItem(){
        App.cart.push({material:matItem.value,qtd:qtdItem.value});
        cart.innerHTML+=`<div>${matItem.value} - ${qtdItem.value}</div>`;
        matItem.value=qtdItem.value="";
    },
    enviar(){
        if(!osmId.value || !App.cart.length){
            alert("Complete a OSM");
            return;
        }
        alert("✅ OSM criada");
        App.cart=[];
        cart.innerHTML="";
        osmId.value="";
        Router.go("scr-menu");
    }
};

const Router={
    go(id){
        document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
    }
};

window.onload=()=>{
    const u=sessionStorage.getItem("user");
    if(u){
        App.user=JSON.parse(u);
        uiUser.innerText="Olá, "+App.user.nome;
        Router.go("scr-menu");
    }
};
</script>

</body>
</html>
