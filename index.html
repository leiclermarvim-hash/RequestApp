<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - V16.2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444; --warning:#ffcc00;
        }
        * { box-sizing:border-box; }
        body{
            margin:0; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:radial-gradient(circle at top,var(--bg1),var(--bg2));
            color:#fff; min-height: 100vh;
        }
        
        /* Estrutura de Telas */
        .screen{ display:none; min-height:100vh; justify-content:center; align-items:center; padding: 20px; }
        .screen.active{ display:flex; flex-direction: column; }
        
        /* Componentes UI */
        .card{
            width:100%; max-width:400px; padding:30px; border-radius:20px;
            background:var(--glass); backdrop-filter: blur(15px); text-align:center;
            box-shadow:0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        input, button{ width:100%; padding:14px; margin-top:12px; border:none; border-radius:12px; font-size:15px; outline: none; }
        input { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        button{ background:linear-gradient(135deg,var(--accent),var(--primary)); font-weight:700; cursor:pointer; color:#000; }
        
        /* Menu Grid */
        .menu-container { width: 100%; max-width: 600px; }
        .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top: 20px; }
        
        /* Listagens (Pai e Filho) */
        .lista-container { margin-top:20px; width: 100%; max-height:400px; overflow-y:auto; padding-right: 5px; }
        .item-card { 
            padding:15px; background:rgba(255,255,255,0.05); border-radius:12px; 
            margin-bottom:10px; border-left: 4px solid var(--accent); text-align: left;
        }
        
        .badge { font-size: 10px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; font-weight: bold; }
        .badge-perfil { background: var(--accent); color: #000; }
        .badge-centro { background: rgba(255,255,255,0.2); color: #fff; margin-left: 5px; }

        footer{ position:fixed; bottom:10px; width:100%; text-align:center; font-size:11px; color:#aaa; opacity: 0.6; }
    </style>
</head>

<body>

    <!-- 1. TELA DE LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="card">
            <h2 style="margin-bottom:5px;">FAST REQUEST PRO</h2>
            <p style="font-size:12px; color:var(--accent); margin-bottom:20px;">SISTEMA DE SOLICITAÇÕES</p>
            <input id="login_mat" type="text" placeholder="Matrícula">
            <input id="login_pass" type="password" placeholder="Senha">
            <button id="btn-login" onclick="executarLogin()">Entrar no Sistema</button>
        </div>
    </div>

    <!-- 2. TELA DE MENU PRINCIPAL -->
    <div id="screen-menu" class="screen">
        <div class="menu-container">
            <div id="user-header" style="text-align: center; margin-bottom: 30px;">
                <h3 id="display-nome" style="margin:0;"></h3>
                <span id="display-perfil" class="badge badge-perfil"></span>
                <span id="display-centro" class="badge badge-centro"></span>
            </div>
            
            <div id="grid-modulos" class="menu-grid">
                <!-- Injetado via JavaScript de acordo com o perfil -->
            </div>
            
            <button onclick="location.reload()" style="margin-top:40px; background:transparent; color:var(--danger); border:1px solid var(--danger);">Sair / Logoff</button>
        </div>
    </div>

    <!-- 3. TELA DE MÓDULO (OSM / PROGRAMADA / ESTOQUE) -->
    <div id="screen-modulo" class="screen">
        <div class="menu-container">
            <h3 id="modulo-titulo">Módulo</h3>
            <input type="text" id="input-busca" placeholder="Pesquisar material..." oninput="logicaFiltroEstoque()">
            
            <div id="lista-modulo" class="lista-container"></div>
            
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff; margin-top:20px;">Voltar ao Menu</button>
        </div>
    </div>

    <!-- 4. TELA DE SOLICITAÇÕES (HISTÓRICO / APROVAÇÃO) -->
    <div id="screen-solicitacoes" class="screen">
        <div class="menu-container">
            <h3 id="solic-titulo">Solicitações</h3>
            <div id="lista-pedidos" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff; margin-top:20px;">Voltar ao Menu</button>
        </div>
    </div>

    <footer>FAST REQUEST PRO • v16.2 • © 2026</footer>

<script>
// --- ESTRUTURA DE DADOS GLOBAL ---
const GITHUB_MB52 = "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/main/base_dados/MB52.XLSX";

let appState = {
    user: null,       // matricula, nome, perfil, centro
    estoque: [],      // Dados do MB52 filtrados por centro
    carrinho: [],     // Itens da solicitação atual (Filhos)
    solicitacoes: []  // DB de pedidos (Pai)
};

// --- ESTRUTURA DE NAVEGAÇÃO ---
function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// --- ESTRUTURA DE AUTENTICAÇÃO E PERFIL ---
async function executarLogin() {
    const mat = document.getElementById('login_mat').value;
    const pass = document.getElementById('login_pass').value;
    const btn = document.getElementById('btn-login');

    if(!mat || !pass) return alert("Preencha as credenciais!");
    btn.innerText = "Autenticando...";

    try {
        // Simulação da chamada de API que retorna as 5 colunas
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ matricula: mat, senha: pass })
        });
        const res = await response.json();

        if(res.authenticated) {
            // Mapeia os dados do banco para o estado do app
            appState.user = {
                nome: res.user.nome,
                perfil: res.user.perfil.toLowerCase(),
                centro: res.user.centro.toString().toUpperCase(),
                matricula: res.user.matricula
            };

            renderizarMenuPorPerfil();
            await carregarEstoqueMB52(); // Carrega filtrando pelo centro do usuário
            mudarTela('screen-menu');
        } else {
            alert("Usuário não encontrado.");
            btn.innerText = "Entrar no Sistema";
        }
    } catch(e) {
        alert("Erro de conexão com servidor de usuários.");
        btn.innerText = "Entrar no Sistema";
    }
}

// --- ESTRUTURA DE HIERARQUIA DE ACESSO ---
function renderizarMenuPorPerfil() {
    const grid = document.getElementById('grid-modulos');
    const nomeDisp = document.getElementById('display-nome');
    const perfilDisp = document.getElementById('display-perfil');
    const centroDisp = document.getElementById('display-centro');

    nomeDisp.innerText = appState.user.nome;
    perfilDisp.innerText = appState.user.perfil;
    centroDisp.innerText = `Centro: ${appState.user.centro}`;
    
    grid.innerHTML = "";

    // Definição de permissões por perfil
    const modulos = {
        solicitante: [
            { n: "📋 Gerar OSM", c: () => abrirModulo('OSM') },
            { n: "📆 Gerar Programada", c: () => abrirModulo('PROGRAMADA') },
            { n: "🔁 Conversor", c: () => alert("Módulo Conversor") },
            { n: "📂 Solicitações", c: () => abrirSolicitacoes("Minhas Solicitações") }
        ],
        aprovador: [
            { n: "📋 Criar OSM", c: () => abrirModulo('OSM') },
            { n: "📆 Criar Programada", c: () => abrirModulo('PROGRAMADA') },
            { n: "📂 Solicitações Recebidas", c: () => abrirSolicitacoes("Pedidos para Aprovar") }
        ],
        administrador: [
            { n: "📊 Dashboard Gestor", c: () => alert("Painel Administrativo") },
            { n: "👥 Gestão Usuários", c: () => alert("Cadastro de Pessoal") },
            { n: "⚙️ Configurações", c: () => alert("Configurações") },
            { n: "📂 Todas Solicitações", c: () => abrirSolicitacoes("Gestão Global") }
        ]
    };

    const meusModulos = modulos[appState.user.perfil] || [];
    meusModulos.forEach(m => {
        const btn = document.createElement('button');
        btn.innerText = m.n;
        btn.onclick = m.c;
        grid.appendChild(btn);
    });
}

// --- ESTRUTURA DE FILTRO POR CENTRO (MB52) ---
async function carregarEstoqueMB52() {
    try {
        const response = await fetch(GITHUB_MB52 + "?t=" + new Date().getTime());
        const data = await response.arrayBuffer();
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet);

        // FILTRO CRÍTICO: Filtra o estoque apenas para o CENTRO do usuário logado
        appState.estoque = json.filter(item => {
            const centroItem = item["Centro"]?.toString().toUpperCase();
            return centroItem === appState.user.centro;
        }).map(item => ({
            codigo: item["Material"],
            descricao: item["Texto breve material"],
            saldo: item["Utilização livre"],
            unidade: item["Unid.medida básica"],
            deposito: item["Depósito"]
        }));

        console.log(`Estoque carregado para centro ${appState.user.centro}: ${appState.estoque.length} itens.`);
    } catch(e) {
        console.error("Erro ao processar MB52:", e);
    }
}

// --- ESTRUTURA DE FUNCIONALIDADES (MODULOS) ---
function abrirModulo(tipo) {
    document.getElementById('modulo-titulo').innerText = "Módulo: " + tipo;
    mudarTela('screen-modulo');
    logicaFiltroEstoque();
}

function logicaFiltroEstoque() {
    const busca = document.getElementById('input-busca').value.toLowerCase();
    const lista = document.getElementById('lista-modulo');
    lista.innerHTML = "";

    const filtrados = appState.estoque.filter(i => 
        i.codigo?.toString().toLowerCase().includes(busca) || 
        i.descricao?.toLowerCase().includes(busca)
    );

    filtrados.slice(0, 30).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
            <div style="font-weight:bold; color:var(--accent);">${item.codigo}</div>
            <div style="font-size:13px; margin:4px 0;">${item.descricao}</div>
            <div style="font-size:12px; opacity:0.8;">Saldo: ${item.saldo} ${item.unidade} | Dep: ${item.deposito}</div>
            <button onclick="adicionarItem('${item.codigo}')" style="padding:5px; font-size:10px; width:auto; margin-top:10px;">+ Adicionar</button>
        `;
        lista.appendChild(div);
    });
}

function abrirSolicitacoes(titulo) {
    document.getElementById('solic-titulo').innerText = titulo;
    mudarTela('screen-solicitacoes');
    // Aqui seria carregada a lista de pedidos do banco de dados (Pai e Filho)
}

function adicionarItem(codigo) {
    alert("Item " + codigo + " adicionado ao rascunho da solicitação!");
}

</script>
</body>
</html>
