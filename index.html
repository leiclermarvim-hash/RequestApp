<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444;
        }
        * { box-sizing:border-box; transition: all 0.3s ease; }
        body {
            margin:0; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, var(--bg1), var(--bg2));
            color:#fff; min-height: 100vh; overflow-x: hidden;
        }

        /* Estrutura de Telas */
        .screen { display:none; min-height:100vh; flex-direction: column; align-items:center; padding: 20px; }
        .screen.active { display:flex; }

        /* Card de Login */
        .card-login {
            margin-top: 10vh; width:100%; max-width:350px; padding:40px; 
            background:var(--glass); backdrop-filter: blur(15px); border-radius:25px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Menu Grid */
        .menu-container { width: 100%; max-width: 500px; text-align: center; }
        .menu-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }

        input, button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:12px; font-size:15px; outline:none; }
        input { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.05); }
        button { background: linear-gradient(135deg, var(--accent), var(--primary)); font-weight:700; cursor:pointer; color:#000; }
        button:hover { transform: translateY(-2px); opacity: 0.9; }

        /* Estilo de Itens de Lista */
        .lista-scroll { width: 100%; max-height: 400px; overflow-y: auto; margin-top: 20px; padding-right: 5px; }
        .item-row { 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; 
            margin-bottom: 10px; border-left: 4px solid var(--accent); text-align: left;
        }

        .user-info { margin-bottom: 20px; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .badge { font-size: 10px; padding: 3px 8px; border-radius: 5px; background: var(--accent); color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div id="scr-login" class="screen active">
        <div class="card-login">
            <h2>FAST REQUEST</h2>
            <p style="color:var(--accent); font-size: 12px;">PRO V16.2</p>
            <input id="f_mat" type="text" placeholder="Matrícula">
            <input id="f_pass" type="password" placeholder="Senha">
            <button onclick="handleLogin()">Acessar</button>
        </div>
    </div>

    <div id="scr-menu" class="screen">
        <div class="menu-container">
            <div class="user-info">
                <h3 id="u_nome" style="margin:0;"></h3>
                <span id="u_perfil" class="badge"></span>
                <span id="u_centro" class="badge" style="background:rgba(255,255,255,0.2); color:#fff;"></span>
            </div>
            
            <div id="grid-main" class="menu-grid">
                </div>

            <button onclick="location.reload()" style="background:transparent; color:var(--danger); border:1px solid var(--danger); margin-top:40px;">Sair</button>
        </div>
    </div>

    <div id="scr-operacao" class="screen">
        <div class="menu-container">
            <h3 id="mod-titulo">Módulo</h3>
            <input type="text" id="mod-busca" placeholder="Filtrar por código ou descrição..." oninput="renderizarEstoque()">
            <div id="mod-lista" class="lista-scroll"></div>
            <button onclick="mudarTela('scr-menu')" style="background:#333; color:#fff; margin-top:20px;">Voltar</button>
        </div>
    </div>

<script>
// --- CONFIGURAÇÃO GLOBAL ---
const PATH_ESTOQUE = "base_dados/MB52.XLSX"; 
let state = { user: null, estoqueFull: [], filteredEstoque: [] };

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// --- LOGICA DE AUTENTICAÇÃO ---
async function handleLogin() {
    const mat = document.getElementById('f_mat').value;
    const pass = document.getElementById('f_pass').value;

    try {
        // Chamada para sua API Vercel
        const res = await fetch('/api/login', {
            method: 'POST',
            body: JSON.stringify({ matricula: mat, senha: pass })
        });
        const data = await res.json();

        if (data.authenticated) {
            state.user = data.user; // {nome, perfil, centro, matricula}
            setupUI();
            await loadEstoque();
            mudarTela('scr-menu');
        } else {
            alert("Credenciais inválidas");
        }
    } catch (e) {
        alert("Erro ao conectar com a API de login.");
    }
}

// --- UI DINÂMICA POR PERFIL ---
function setupUI() {
    document.getElementById('u_nome').innerText = state.user.nome;
    document.getElementById('u_perfil').innerText = state.user.perfil.toUpperCase();
    document.getElementById('u_centro').innerText = "Centro: " + state.user.centro;

    const grid = document.getElementById('grid-main');
    grid.innerHTML = "";

    const modulos = {
        solicitante: [
            { label: "📋 Gerar OSM", icon: "OSM", cmd: () => abrirMod("Gerar OSM") },
            { label: "📆 Gerar Programada", icon: "PROG", cmd: () => abrirMod("Gerar Programada") },
            { label: "🔁 Conversor", icon: "CONV", cmd: () => alert("Conversor") },
            { label: "📂 Solicitações", icon: "SOL", cmd: () => alert("Minhas Solicitações") }
        ],
        aprovador: [
            { label: "✅ Pedidos Recebidos", icon: "APR", cmd: () => alert("Aprovações") },
            { label: "📋 Criar OSM", icon: "OSM", cmd: () => abrirMod("Criar OSM") },
            { label: "📆 Criar Programadas", icon: "PROG", cmd: () => abrirMod("Criar Programada") }
        ],
        administrador: [
            { label: "📊 Gestão Total", icon: "ADM", cmd: () => alert("Painel ADM") },
            { label: "⚙️ Configurações", icon: "CFG", cmd: () => alert("Config") }
        ]
    };

    const meusBotoes = modulos[state.user.perfil.toLowerCase()] || [];
    meusBotoes.forEach(m => {
        const btn = document.createElement('button');
        btn.innerHTML = m.label;
        btn.onclick = m.cmd;
        grid.appendChild(btn);
    });
}

// --- GESTÃO DE ESTOQUE (FILTRO POR CENTRO) ---
async function loadEstoque() {
    try {
        const response = await fetch(PATH_ESTOQUE);
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawJson = XLSX.utils.sheet_to_json(sheet);

        // FILTRAGEM POR CENTRO DO USUÁRIO
        state.estoqueFull = rawJson.filter(item => {
            return item["Centro"]?.toString() === state.user.centro.toString();
        });
    } catch (e) {
        console.error("Erro ao carregar MB52:", e);
    }
}

function abrirMod(titulo) {
    document.getElementById('mod-titulo').innerText = titulo;
    mudarTela('scr-operacao');
    renderizarEstoque();
}

function renderizarEstoque() {
    const busca = document.getElementById('mod-busca').value.toLowerCase();
    const lista = document.getElementById('mod-lista');
    lista.innerHTML = "";

    const filtrados = state.estoqueFull.filter(i => 
        i["Material"]?.toString().toLowerCase().includes(busca) || 
        i["Texto breve material"]?.toLowerCase().includes(busca)
    );

    filtrados.slice(0, 50).forEach(item => {
        const row = document.createElement('div');
        row.className = 'item-row';
        row.innerHTML = `
            <div style="font-weight:bold; color:var(--accent);">${item["Material"]}</div>
            <div style="font-size:13px; margin:5px 0;">${item["Texto breve material"]}</div>
            <div style="font-size:11px; opacity:0.7;">
                Saldo: <b>${item["Utilização livre"]}</b> ${item["Unid.medida básica"]} | Dep: ${item["Depósito"]}
            </div>
        `;
        lista.appendChild(row);
    });
}
</script>
</body>
</html>
