<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST REQUEST</title>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#020417;
    color:#e0e0e0;
}
.screen{
    display:none;
    min-height:100vh;
    align-items:center;
    justify-content:center;
}
.screen.active{display:flex}
.card{
    background:#0c1133;
    padding:24px;
    border-radius:14px;
    width:100%;
    max-width:420px;
}
h2{color:#00ffe0;text-align:center}
input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:none;
}
button{
    cursor:pointer;
    font-weight:700;
    background:linear-gradient(135deg,#00ffe0,#0066ff);
    color:#000;
}
button.outline{
    background:none;
    border:1px solid #666;
    color:#ccc;
}
.item{
    background:#11194d;
    padding:8px;
    border-left:4px solid #00ffe0;
    margin-top:6px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="scr-login" class="screen active">
<div class="card">
<h2>FAST REQUEST</h2>

<input id="inMat" placeholder="Matrícula">
<input id="inPass" type="password" placeholder="Senha">

<button onclick="Auth.login()">Entrar</button>
</div>
</div>

<!-- MENU -->
<div id="scr-menu" class="screen">
<div class="card">
<h2 id="uiUser"></h2>
<button onclick="Router.go('scr-osm')">Gerar OSM</button>
<button onclick="Pedido.meus()">Meus Pedidos</button>
<button class="outline" onclick="Auth.logout()">Logout</button>
</div>
</div>

<!-- OSM -->
<div id="scr-osm" class="screen">
<div class="card">
<h2>Nova OSM</h2>

<input id="osmId" placeholder="Número da OSM">

<input id="matItem" placeholder="Material">
<input id="qtdItem" type="number" placeholder="Quantidade">
<input id="patItem" placeholder="Patrimônio">

<button onclick="OSM.addItem()">Adicionar Item</button>

<div id="cart"></div>

<button onclick="OSM.enviar()">Confirmar OSM</button>
<button class="outline" onclick="Router.go('scr-menu')">Voltar</button>
</div>
</div>

<script>
/* ================= APP ================= */
const App={
    user:null,
    cart:[],
    pedidos:[]
};

/* ================= AUTH ================= */
const Auth={
    login(){
        const mat = inMat.value.trim();
        const pass = inPass.value.trim();

        if(!mat || !pass){
            alert("Informe matrícula e senha");
            return;
        }

        // 🔐 Simulação de autenticação (igual antes)
        App.user = {
            matricula: mat,
            nome: "Usuário " + mat
        };

        sessionStorage.setItem("user", JSON.stringify(App.user));
        UI.init();
    },
    logout(){
        sessionStorage.clear();
        location.reload();
    }
};

/* ================= UI ================= */
const UI={
    init(){
        uiUser.innerText = "Olá, " + App.user.nome;
        Router.go("scr-menu");
    }
};

/* ================= OSM ================= */
const OSM={
    addItem(){
        if(!matItem.value || !qtdItem.value){
            alert("Preencha material e quantidade");
            return;
        }

        App.cart.push({
            material: matItem.value,
            quantidade: Number(qtdItem.value),
            patrimonio: patItem.value || "N/A"
        });

        matItem.value = qtdItem.value = patItem.value = "";
        this.render();
    },
    render(){
        cart.innerHTML = App.cart.map(i =>
            `<div class="item">
                ${i.material} | Qtd: ${i.quantidade}<br>
                <small>${i.patrimonio}</small>
            </div>`
        ).join("");
    },
    async enviar(){
        if(!osmId.value || !App.cart.length){
            alert("Informe OSM e adicione itens");
            return;
        }

        const osm = {
            id: osmId.value,
            solicitante: App.user,
            data: new Date().toISOString(),
            status: "AGUARDANDO",
            itens: App.cart
        };

        try{
            await fetch("/api/pedidos",{
                method:"POST",
                headers:{ "Content-Type":"application/json" },
                body: JSON.stringify(osm)
            });
        }catch(e){
            console.warn("API indisponível");
        }

        App.pedidos.push(osm);

        alert("✅ OSM criada");
        App.cart=[];
        this.render();
        osmId.value="";
        Router.go("scr-menu");
    }
};

/* ================= PEDIDOS ================= */
const Pedido={
    meus(){
        console.clear();
        console.log(App.pedidos);
        alert("Pedidos no console (F12)");
    }
};

/* ================= ROUTER ================= */
const Router={
    go(id){
        document.querySelectorAll(".screen")
            .forEach(s=>s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
    }
};

/* ================= START ================= */
window.onload = () => {
    const u = sessionStorage.getItem("user");
    if(u){
        App.user = JSON.parse(u);
        UI.init();
    }
};
</script>

</body>
</html>
