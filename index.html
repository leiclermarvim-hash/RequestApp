<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - V16.2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444; --warning:#ffcc00;
        }
        * { box-sizing:border-box; transition: all 0.2s ease; }
        body {
            margin:0; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, var(--bg1), var(--bg2));
            color:#fff; min-height: 100vh;
        }

        .screen { display:none; min-height:100vh; flex-direction: column; align-items:center; padding: 20px; }
        .screen.active { display:flex; }

        /* Login */
        .card-login {
            margin-top: 15vh; width:100%; max-width:350px; padding:40px; 
            background:var(--glass); backdrop-filter: blur(15px); border-radius:25px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Menu */
        .menu-container { width: 100%; max-width: 500px; text-align: center; }
        .menu-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }

        input, button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:12px; font-size:15px; outline:none; }
        input { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        button { background: linear-gradient(135deg, var(--accent), var(--primary)); font-weight:700; cursor:pointer; color:#000; }

        /* Listagem e Carrinho */
        .lista-scroll { width: 100%; max-height: 400px; overflow-y: auto; margin-top: 20px; }
        .item-card { 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; 
            margin-bottom: 12px; border-left: 4px solid var(--accent); text-align: left;
        }
        
        .carrinho-bar {
            position: fixed; bottom: 20px; width: 90%; max-width: 460px;
            background: var(--primary); color: white; padding: 15px;
            border-radius: 15px; display: none; justify-content: space-between; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .badge { font-size: 10px; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .badge-perfil { background: var(--accent); color: #000; }
    </style>
</head>
<body>

    <!-- TELA: LOGIN -->
    <div id="scr-login" class="screen active">
        <div class="card-login">
            <h2>FAST REQUEST</h2>
            <p style="color:var(--accent); font-size: 11px;">SISTEMA LOGÍSTICO</p>
            <input id="f_mat" type="text" placeholder="Matrícula">
            <input id="f_pass" type="password" placeholder="Senha">
            <button id="btn-entrar" onclick="handleLogin()">ENTRAR</button>
        </div>
    </div>

    <!-- TELA: MENU -->
    <div id="scr-menu" class="screen">
        <div class="menu-container">
            <div style="margin-bottom: 30px;">
                <h3 id="u_nome" style="margin:0;"></h3>
                <span id="u_perfil" class="badge badge-perfil"></span>
                <span id="u_centro" class="badge" style="background:rgba(255,255,255,0.1);"></span>
            </div>
            <div id="grid-modulos" class="menu-grid"></div>
            <button onclick="location.reload()" style="background:transparent; color:var(--danger); border:1px solid var(--danger); margin-top:40px;">SAIR</button>
        </div>
    </div>

    <!-- TELA: OPERAÇÃO -->
    <div id="scr-operacao" class="screen">
        <div class="menu-container">
            <h3 id="mod-titulo">Módulo</h3>
            <input type="text" id="mod-busca" placeholder="Filtrar estoque..." oninput="renderizarItens()">
            <div id="mod-lista" class="lista-scroll"></div>
            <button onclick="mudarTela('scr-menu')" style="background:#444; color:#fff; margin-top:10px;">VOLTAR</button>
        </div>
        
        <div id="carrinho-status" class="carrinho-bar">
            <span id="cart-count">0 itens selecionados</span>
            <button onclick="finalizarSolicitacao()" style="width: auto; margin: 0; padding: 8px 15px; background: white;">CONCLUIR</button>
        </div>
    </div>

<script>
const PATH_MB52 = "base_dados/MB52.XLSX"; 
let state = { 
    user: null, 
    estoqueFiltrado: [],
    carrinho: [] 
};

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    // Esconde carrinho se voltar ao menu
    if(id === 'scr-menu') document.getElementById('carrinho-status').style.display = 'none';
}

async function handleLogin() {
    const mat = document.getElementById('f_mat').value.trim();
    const pass = document.getElementById('f_pass').value.trim();
    const btn = document.getElementById('btn-entrar');

    btn.innerText = "VALIDANDO...";
    
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matricula: mat, senha: pass })
        });
        const data = await res.json();

        if (data.authenticated) {
            state.user = data.user;
            setupMenu();
            await loadEstoque();
            mudarTela('scr-menu');
        } else {
            alert("Falha no login: " + data.message);
            btn.innerText = "ENTRAR";
        }
    } catch (e) {
        alert("Erro de conexão.");
        btn.innerText = "ENTRAR";
    }
}

function setupMenu() {
    document.getElementById('u_nome').innerText = state.user.nome;
    document.getElementById('u_perfil').innerText = state.user.perfil.toUpperCase();
    document.getElementById('u_centro').innerText = "Centro: " + state.user.centro;

    const grid = document.getElementById('grid-modulos');
    grid.innerHTML = "";
    
    const perfil = state.user.perfil.toLowerCase();
    const menus = {
        solicitante: [
            { txt: "📋 Gerar OSM", act: () => abrirMod("Gerar OSM") },
            { txt: "📆 Gerar Programada", act: () => abrirMod("Gerar Programada") },
            { txt: "🔁 Conversor", act: () => alert("Módulo Conversor") },
            { txt: "📂 Solicitações", act: () => alert("Histórico") }
        ],
        aprovador: [
            { txt: "✅ Aprovações", act: () => alert("Pedidos Pendentes") },
            { txt: "📋 Criar OSM", act: () => abrirMod("Criar OSM") }
        ],
        adm: [
            { txt: "📊 Dashboard", act: () => alert("Painel ADM") },
            { txt: "⚙️ Config", act: () => alert("Configurações") }
        ]
    };

    (menus[perfil] || []).forEach(b => {
        const btn = document.createElement('button');
        btn.innerText = b.txt;
        btn.onclick = b.act;
        grid.appendChild(btn);
    });
}

async function loadEstoque() {
    try {
        const response = await fetch(PATH_MB52);
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawJson = XLSX.utils.sheet_to_json(sheet);

        // Filtro por Centro do Usuário
        state.estoqueFiltrado = rawJson.filter(item => 
            item["Centro"]?.toString().trim() === state.user.centro.toString().trim()
        );
    } catch (e) { console.error("Erro MB52:", e); }
}

function abrirMod(titulo) {
    document.getElementById('mod-titulo').innerText = titulo;
    state.carrinho = [];
    atualizarCarrinhoUI();
    mudarTela('scr-operacao');
    renderizarItens();
}

function renderizarItens() {
    const busca = document.getElementById('mod-busca').value.toLowerCase();
    const lista = document.getElementById('mod-lista');
    lista.innerHTML = "";

    const filtrados = state.estoqueFiltrado.filter(i => 
        i["Material"]?.toString().toLowerCase().includes(busca) || 
        i["Texto breve material"]?.toLowerCase().includes(busca)
    );

    filtrados.slice(0, 30).forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
            <div style="color:var(--accent); font-weight:bold;">${item["Material"]}</div>
            <div style="font-size:12px; margin:4px 0;">${item["Texto breve material"]}</div>
            <div style="font-size:11px; opacity:0.7;">Saldo: ${item["Utilização livre"]} | Dep: ${item["Depósito"]}</div>
            <button onclick="adicionarAoCarrinho('${item["Material"]}')" style="padding:5px; font-size:10px; width:auto; margin-top:8px;">+ ADICIONAR</button>
        `;
        lista.appendChild(card);
    });
}

// --- LÓGICA DO CARRINHO (ESTRUTURA FILHO) ---
function adicionarAoCarrinho(codigo) {
    const itemEstoque = state.estoqueFiltrado.find(i => i["Material"].toString() === codigo.toString());
    const qtd = prompt(`Quantidade para o item ${codigo}:`, "1");
    
    if (qtd && !isNaN(qtd) && qtd > 0) {
        state.carrinho.push({
            material: codigo,
            descricao: itemEstoque["Texto breve material"],
            quantidade: qtd,
            deposito: itemEstoque["Depósito"]
        });
        atualizarCarrinhoUI();
    }
}

function atualizarCarrinhoUI() {
    const bar = document.getElementById('carrinho-status');
    const count = document.getElementById('cart-count');
    
    if (state.carrinho.length > 0) {
        bar.style.display = 'flex';
        count.innerText = `${state.carrinho.length} item(s) na lista`;
    } else {
        bar.style.display = 'none';
    }
}

function finalizarSolicitacao() {
    console.log("Enviando Pedido (Pai):", state.user.matricula);
    console.log("Itens (Filhos):", state.carrinho);
    alert(`Solicitação enviada com ${state.carrinho.length} itens para o Centro ${state.user.centro}!`);
    state.carrinho = [];
    mudarTela('scr-menu');
}
</script>
</body>
</html>
