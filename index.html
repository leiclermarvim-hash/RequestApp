<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FAST REQUEST PRO - V20.0</title>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #020417; --bg-card: rgba(255, 255, 255, 0.04);
            --accent: #00ffe0; --primary: #0066ff; --danger: #ff4444;
            --warning: #ffb800; --success: #00c851;
            --text-main: #e0e0e0; --transition: all 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; }

        .screen { display: none; width: 100%; max-width: 600px; padding: 20px; animation: fadeIn 0.3s ease; }
        .screen.active { display: flex; flex-direction: column; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .glass-card { background: var(--bg-card); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        h2 { color: var(--accent); margin-bottom: 20px; font-size: 1.5rem; }
        .label-tiny { font-size: 10px; text-transform: uppercase; color: var(--accent); font-weight: 800; margin: 10px 0 5px 0; display: block; }

        input, select, button { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: #fff; margin-bottom: 10px; }
        input:focus { border-color: var(--accent); }
        
        .btn-primary { background: linear-gradient(135deg, var(--accent), var(--primary)); color: #000; font-weight: 700; border: none; cursor: pointer; }
        .btn-outline { background: transparent; border: 1px solid var(--danger); color: var(--danger); cursor: pointer; margin-top: 20px; }

        .grid-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }
        .nav-card {
            height: 110px; border: 1px solid rgba(255,255,255,0.1); border-radius: 18px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; cursor: pointer; transition: var(--transition); background: rgba(255,255,255,0.02);
            text-align: center; font-size: 13px; padding: 5px;
        }
        .nav-card:hover { border-color: var(--accent); background: rgba(0, 255, 224, 0.1); color: var(--accent); transform: translateY(-3px); }
        .nav-card i { font-size: 24px; }

        .hidden { display: none !important; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        /* Status Badges */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; }
        .status-pendente { background: var(--warning); color: #000; }
        .status-reserva { background: var(--primary); color: #fff; }
        .status-retirado { background: var(--success); color: #fff; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <section id="scr-login" class="screen active">
        <div class="glass-card" style="max-width: 380px; align-self: center; text-align: center;">
            <i class="fas fa-shield-alt" style="font-size: 40px; color: var(--accent); margin-bottom: 15px;"></i>
            <h2>FAST REQUEST</h2>
            <input type="text" id="in-mat" placeholder="Matrícula">
            <input type="password" id="in-pass" placeholder="Senha">
            <button class="btn-primary" onclick="Auth.login()">ENTRAR</button>
        </div>
    </section>

    <!-- MENU PRINCIPAL -->
    <section id="scr-menu" class="screen">
        <div class="glass-card">
            <h2 id="ui-greeting">Olá</h2>
            <div id="ui-badge" style="font-size: 11px; color: var(--accent); margin-bottom: 20px;"></div>

            <div id="main-nav" class="grid-nav">
                <!-- Solicitante / Adm / Aprovador -->
                <div class="nav-card p-solic p-adm p-aprov" onclick="Router.go('scr-osm')"><i class="fas fa-file-invoice"></i> Gerar OSM</div>
                <div class="nav-card p-solic p-adm" onclick="alert('Módulo Separar em breve')"><i class="fas fa-boxes"></i> Separar Programadas</div>
                <div class="nav-card p-solic p-aprov p-adm" onclick="Router.go('scr-conversor')"><i class="fas fa-weight-hanging"></i> Conversor</div>
                <div class="nav-card p-solic p-adm" onclick="Router.go('scr-pedidos')"><i class="fas fa-history"></i> Meus Pedidos</div>
                
                <!-- Aprovador / Adm -->
                <div class="nav-card p-aprov p-adm" onclick="alert('Verificando Programadas...')"><i class="fas fa-tasks"></i> Verificar Programadas</div>
                <div class="nav-card p-aprov p-adm" onclick="alert('Aprovando OSMs...')"><i class="fas fa-check-double"></i> Aprovar Pedidos</div>
                <div class="nav-card p-aprov p-adm" onclick="alert('Gerar Programada')"><i class="fas fa-calendar-plus"></i> Gerar Programada</div>

                <!-- Admin Only -->
                <div class="nav-card p-adm" onclick="alert('Usuários/Materiais')"><i class="fas fa-database"></i> Cadastros</div>
                <div class="nav-card p-adm" onclick="alert('Enviando para Github...')"><i class="fab fa-github"></i> Atualizar MB52</div>
            </div>

            <button class="btn-outline" onclick="location.reload()">LOGOUT</button>
        </div>
    </section>

    <!-- GERAR OSM -->
    <section id="scr-osm" class="screen">
        <div class="glass-card">
            <h2>📋 Gerar OSM</h2>
            <div class="grid-2">
                <div><span class="label-tiny">Aprovador</span><select id="sel-aprovador" onchange="OSM.sync()"></select></div>
                <div><span class="label-tiny">Matrícula</span><input type="text" id="osm-mat-aprov" readonly></div>
            </div>
            <!-- ... (resto dos inputs de busca permanecem iguais) -->
            <input type="text" id="search-in" placeholder="Buscar Material..." onkeyup="OSM.search(this.value)">
            <div id="search-pop" class="search-popover"></div>
            <div id="cart-list" style="margin-top:15px;"></div>
            <button class="btn-primary" onclick="OSM.finalize()">ENVIAR PARA APROVAÇÃO</button>
            <button class="btn-outline" style="border-color:#555; color:#aaa" onclick="Router.go('scr-menu')">VOLTAR</button>
        </div>
    </section>

    <!-- CONVERSOR -->
    <section id="scr-conversor" class="screen">
        <div class="glass-card">
            <h2>⚖️ Conversor Kg x M</h2>
            <select id="c-fator"><option value="0.190">Multiplex 1x16 (0.190)</option><option value="0.320">Multiplex 1x35 (0.320)</option></select>
            <div class="grid-2">
                <input type="number" id="c-m" placeholder="Metros" oninput="Tool.calc(1)">
                <input type="number" id="c-k" placeholder="Kg" oninput="Tool.calc(2)">
            </div>
            <button class="btn-primary" onclick="Router.go('scr-menu')">VOLTAR</button>
        </div>
    </section>

    <script>
        const App = {
            user: null, users: [], stock: [], cart: [],
            urls: {
                u: "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/refs/heads/main/configuracoes/usuarios.csv",
                s: "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/main/base_dados/MB52.XLSX"
            }
        };

        const Auth = {
            async login() {
                const m = document.getElementById('in-mat').value;
                const p = document.getElementById('in-pass').value;
                try {
                    const r = await fetch(App.urls.u + "?t=" + Date.now());
                    const t = await r.text();
                    const lines = t.split('\n').filter(l => l.trim());
                    const sep = t.includes(';') ? ';' : ',';
                    const head = lines[0].split(sep).map(h => h.trim().toUpperCase());
                    App.users = lines.slice(1).map(l => {
                        let o = {}, c = l.split(sep);
                        head.forEach((h, i) => o[h] = c[i]?.trim());
                        return o;
                    });

                    App.user = App.users.find(u => u.MATRICULA === m && u.SENHA === p);
                    
                    if(App.user) {
                        await this.loadStock();
                        UI.build();
                    } else alert("Matrícula ou Senha incorretos");
                } catch(e) { alert("Erro ao conectar com servidor"); }
            },
            async loadStock() {
                try {
                    const r = await fetch(App.urls.s);
                    const ab = await r.arrayBuffer();
                    const wb = XLSX.read(ab, {type: 'array'});
                    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    App.stock = raw.map(i => ({
                        sap: i["Material"]?.toString(), 
                        desc: i["Texto breve material"],
                        saldo: parseFloat(i["Utilização livre"]), 
                        centro: i["Centro"]?.toString()
                    })).filter(i => i.centro === App.user.CENTRO && i.saldo > 0);
                } catch(e) { console.error("Estoque não carregado"); }
            }
        };

        const UI = {
            build() {
                const p = App.user.PERFIL.toUpperCase();
                document.getElementById('ui-greeting').innerText = `Olá, ${App.user.NOME}`;
                document.getElementById('ui-badge').innerText = `PERFIL: ${p} | CENTRO: ${App.user.CENTRO}`;
                
                // Controle de Acesso Visual
                document.querySelectorAll('.nav-card').forEach(card => card.classList.add('hidden'));
                
                if(p === 'ADMINISTRADOR' || p === 'ADM') {
                    document.querySelectorAll('.p-adm').forEach(el => el.classList.remove('hidden'));
                } else if(p === 'APROVADOR') {
                    document.querySelectorAll('.p-aprov').forEach(el => el.classList.remove('hidden'));
                } else {
                    document.querySelectorAll('.p-solic').forEach(el => el.classList.remove('hidden'));
                }

                this.setupOSM();
                Router.go('scr-menu');
            },
            setupOSM() {
                const aprs = App.users.filter(u => (u.PERFIL.includes('APROVADOR') || u.PERFIL.includes('ADM')) && u.CENTRO === App.user.CENTRO);
                document.getElementById('sel-aprovador').innerHTML = `<option value="">Selecione o Aprovador...</option>` + 
                    aprs.map(a => `<option value="${a.NOME}">${a.NOME}</option>`).join('');
            }
        };

        const OSM = {
            sync() {
                const n = document.getElementById('sel-aprovador').value;
                const a = App.users.find(u => u.NOME === n);
                document.getElementById('osm-mat-aprov').value = a ? a.MATRICULA : "";
            },
            finalize() {
                // Simulação do fluxo de envio
                if(!document.getElementById('sel-aprovador').value) return alert("Selecione um aprovador!");
                alert(`Pedido enviado! Status: AGUARDANDO APROVADOR`);
                Router.go('scr-menu');
            }
            // ... (funções search e add permanecem como no original)
        };

        const Tool = {
            calc(m) {
                const f = parseFloat(document.getElementById('c-fator').value);
                if(m === 1) document.getElementById('c-k').value = (document.getElementById('c-m').value * f).toFixed(3);
                else document.getElementById('c-m').value = (document.getElementById('c-k').value / f).toFixed(2);
            }
        };

        const Router = { 
            go(id) { 
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); 
                document.getElementById(id).classList.add('active'); 
            } 
        };
    </script>
</body>
</html>
