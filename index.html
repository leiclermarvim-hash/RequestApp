<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAST REQUEST – OSM Pai e Filho</title>

<style>
body{
    margin:0;
    font-family:Segoe UI,sans-serif;
    background:#020417;
    color:#e0e0e0;
}
.screen{display:none;min-height:100vh;align-items:center;justify-content:center}
.screen.active{display:flex}
.card{
    background:#0c1133;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:420px;
    box-shadow:0 0 20px rgba(0,0,0,.6)
}
h2{color:#00ffe0;text-align:center}
input,button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border-radius:8px;
    border:none;
}
button{
    cursor:pointer;
    font-weight:700;
    background:linear-gradient(135deg,#00ffe0,#0066ff);
    color:#000;
}
button.outline{
    background:none;
    border:1px solid #666;
    color:#ccc;
}
.item{
    background:#11194d;
    padding:8px;
    border-left:4px solid #00ffe0;
    margin-top:6px;
    font-size:14px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="scr-login" class="screen active">
<div class="card">
<h2>FAST REQUEST</h2>
<input id="inMat" placeholder="Matrícula">
<button onclick="Auth.login()">Entrar</button>
</div>
</div>

<!-- MENU -->
<div id="scr-menu" class="screen">
<div class="card">
<h2 id="uiUser"></h2>
<button onclick="Router.go('scr-osm')">Gerar OSM</button>
<button onclick="Pedido.meus()">Meus Pedidos</button>
<button class="outline" onclick="Auth.logout()">Logout</button>
</div>
</div>

<!-- OSM -->
<div id="scr-osm" class="screen">
<div class="card">
<h2>Nova OSM</h2>

<input id="osmId" placeholder="Número da OSM">

<input id="matItem" placeholder="Material">
<input id="qtdItem" type="number" placeholder="Quantidade">
<input id="patItem" placeholder="Patrimônio (opcional)">

<button onclick="OSM.addItem()">Adicionar Item</button>
