<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444;
            --blue-dark: #001a33; --blue-main: #003366; --zebra: rgba(255,255,255,0.05);
        }
        * { box-sizing:border-box; }
        body{
            margin:0; font-family:'Segoe UI',Roboto,sans-serif;
            background:radial-gradient(circle at top,var(--bg1),var(--bg2));
            color:#fff; min-height: 100vh;
        }
        .screen{ display:none; min-height:100vh; justify-content:center; align-items:center; padding: 20px; flex-direction: column; }
        .screen.active{ display:flex; }
        
        .card{
            width:100%; max-width:380px; padding:30px; border-radius:20px;
            background:var(--glass); backdrop-filter: blur(14px); text-align:center;
            box-shadow:0 0 30px rgba(0,255,255,.25); border: 1px solid rgba(255,255,255,0.1);
        }
        
        input, button, select { width:100%; padding:14px; margin-top:10px; border:none; border-radius:12px; font-size:15px; outline: none; }
        input, select { background: rgba(255,255,255,0.1); color: #fff; }
        option { background: #0a0f2c; color: white; }
        button{ background:linear-gradient(135deg,var(--accent),var(--primary)); font-weight:700; cursor:pointer; color:#000; }
        
        /* Menu e Grid */
        .menu{ width:100%; max-width:500px; }
        .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        
        /* Estilização módulo Pedido (OSM) */
        .form-section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .section-title { font-size: 11px; color: var(--accent); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        label { font-weight: 600; font-size: 13px; color: #ccc; display: block; margin-top: 8px; }
        
        .material-box { border: 2px dashed var(--accent); padding: 15px; border-radius: 12px; background: rgba(0,255,224,0.05); margin-bottom: 15px; position: relative; }
        .search-results { position: absolute; background: #1a1a1a; width: 100%; left: 0; z-index: 999; border: 1px solid var(--accent); display: none; max-height: 200px; overflow-y: auto; border-radius: 10px; color: white; }
        
        .list-item { display: grid; grid-template-columns: auto 1fr auto 35px; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
        
        /* Estilização módulo Estoque (Programadas) */
        .lista-container { margin-top:10px; max-height:400px; overflow-y:auto; text-align:left; }
        .item-estoque { padding:12px; background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:8px; border-left: 4px solid var(--accent); }

        .btn-confirm { background: var(--accent); color: #000; width: 100%; font-weight: 800; margin-top: 20px; }
        .btn-confirm:disabled { background: #444; color: #888; cursor: not-allowed; }

        footer{ position:fixed; bottom:10px; width:100%; text-align:center; font-size:11px; color:#aaa; pointer-events: none; z-index: -1; }
        
        @media print {
            body * { visibility: hidden; }
            #history_list, #history_list * { visibility: visible; }
            #history_list { position: absolute; left: 0; top: 0; color: black; }
        }
    </style>
</head>

<body>

    <!-- TELA LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="card">
            <h2>FAST REQUEST PRO</h2>
            <p style="font-size: 12px; color: var(--accent);">Acesso ao RequestApp</p>
            <input id="login_mat" type="text" placeholder="Matrícula">
            <input id="login_pass" type="password" placeholder="Senha">
            <button id="btn-login" onclick="login()">Entrar</button>
        </div>
    </div>

    <!-- TELA PERFIL -->
    <div id="screen-role" class="screen">
        <div class="card">
            <h3>Selecione seu Perfil</h3>
            <button onclick="selecionarPerfil('solicitante')">SOLICITANTE</button>
            <button onclick="selecionarPerfil('atendente')" style="background:#fff; color:#000; margin-top:15px;">ATENDENTE</button>
        </div>
    </div>

    <!-- TELA MENU PRINCIPAL -->
    <div id="screen-menu" class="screen">
        <div class="menu">
            <h3 id="infoUsuario"></h3>
            <div class="menu-grid">
                <button onclick="abrirNovoPedido()">📋 OSM</button>
                <button onclick="abrirProgramada()">📆 Programada</button>
                <button onclick="alert('Em breve')">🔁 Conversor</button>
                <button onclick="mudarTela('screen-history')">📂 Solicitações</button>
            </div>
            <button onclick="location.reload()" style="margin-top:30px; background:transparent; color:var(--danger); border:1px solid var(--danger);">Sair</button>
        </div>
    </div>

    <!-- TELA OSM (GESTÃO DE PEDIDOS) -->
    <div id="screen-osm" class="screen">
        <div class="menu" style="max-width: 550px; padding-bottom: 100px;">
            <h3>Novo Pedido OSM</h3>
            
            <div class="form-section">
                <span class="section-title">👤 Identificação</span>
                <label>Solicitante:</label>
                <div style="display:flex; gap:5px; position:relative">
                    <input type="text" id="sol_nome" placeholder="Buscar Solicitante..." onkeyup="searchData('sol')" autocomplete="off">
                    <div id="sol_results" class="search-results"></div>
                </div>
                <input type="text" id="sol_mat" readonly placeholder="Matrícula" style="background:rgba(255,255,255,0.05); color:var(--accent);">

                <label>Atendente:</label>
                <div style="display:flex; gap:5px; position:relative">
                    <input type="text" id="ate_nome" placeholder="Buscar Atendente..." onkeyup="searchData('ate')" autocomplete="off">
                    <div id="ate_results" class="search-results"></div>
                </div>
                <input type="text" id="ate_mat" readonly placeholder="Matrícula" style="background:rgba(255,255,255,0.05); color:var(--accent);">
            </div>

            <div class="form-section">
                <span class="section-title">🚧 Dados do Pedido</span>
                <label>Projeto ou OSM:</label>
                <input type="text" id="projeto" oninput="this.value = this.value.toUpperCase()">
                
                <label>Tipo de Movimentação:</label>
                <select id="movimentacao">
                    <option value="Z61 - Saída de material">Z61 - Saída de material</option>
                    <option value="Estorno de material">Estorno de material</option>
                    <option value="Z6D - Devolução de sucata">Z6D - Devolução de sucata</option>
                </select>
            </div>

            <div class="material-box">
                <span class="section-title">📦 Seleção de Itens</span>
                <div style="position:relative">
                    <input type="text" id="mat_busca" placeholder="Código ou descrição SAP..." onkeyup="searchData('mat')" autocomplete="off">
                    <div id="mat_results" class="search-results"></div>
                </div>
                <div id="mat_desc" style="font-size:13px; color:var(--accent); margin:8px 0; font-weight:bold;">Nenhum item selecionado</div>
                
                <div style="display:flex; gap:8px;">
                    <div style="flex:1"><label>QTD:</label><input type="text" id="mat_qtd" value="1"></div>
                    <button id="btn_add_mat" onclick="addItem()" style="flex:1.5; margin-top:28px;">ADICIONAR</button>
                </div>
            </div>

            <div id="lista_ui" class="form-section" style="padding:0"></div>

            <button id="btn_confirm" class="btn-confirm" onclick="confirmarPedido()">CONFIRMAR PEDIDO</button>
            <button onclick="mudarTela('screen-menu')" style="margin-top:10px; background:#444; color:#fff;">Voltar</button>
        </div>
    </div>

    <!-- TELA PROGRAMADA (CONSULTA MB52) -->
    <div id="screen-programada" class="screen">
        <div class="menu">
            <h3>Consultar Estoque (MB52)</h3>
            <input type="text" id="buscaMaterial" placeholder="Cód. Sap ou Descrição..." oninput="filtrarEstoque()">
            <div id="listaProdutos" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="margin-top:20px; background:#444; color:#fff;">Voltar</button>
        </div>
    </div>

    <!-- TELA HISTÓRICO -->
    <div id="screen-history" class="screen">
        <div class="menu">
            <h3>Histórico de Pedidos</h3>
            <div id="history_list" style="max-height: 500px; overflow-y: auto;"></div>
            <button onclick="mudarTela('screen-menu')" style="margin-top:20px; background:#444; color:#fff;">Voltar</button>
        </div>
    </div>

    <footer>FAST REQUEST PRO • v15.6.2 • GitHub + Vercel</footer>

<script>
// --- CONFIGURAÇÕES E ESTADO ---
const GITHUB_ESTOQUE = "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/main/base_dados/MB52.XLSX";
const GITHUB_USERS = "https://raw.githubusercontent.com/leiclermarvim-hash/URL_USUARIOS_GITHUB/refs/heads/main/URL_USUARIOS_GITHUB.csv";
const GITHUB_MATS = "https://raw.githubusercontent.com/leiclermarvim-hash/URL_USUARIOS_GITHUB/refs/heads/main/URL_MATERIAIS_GITHUB.csv";

let appState = { 
    usuario: null, 
    perfil: null, 
    dadosUsuario: null, 
    estoque: [], // MB52
    db_users: [], 
    db_mats: [], // Materiais do Pedido
    listaSolicitacao: []
};

// --- NAVEGAÇÃO ---
function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
}

// --- LOGIN E PERFIL ---
async function login() {
    const mat = document.getElementById('login_mat').value;
    const pass = document.getElementById('login_pass').value;
    const btn = document.getElementById('btn-login');
    if (!mat || !pass) return alert("Preencha os campos!");
    btn.innerText = "Conectando...";
    
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ usuario: mat, senha: pass })
        });
        const res = await response.json();
        if (res.authenticated) {
            appState.usuario = mat;
            appState.dadosUsuario = res.user;
            mudarTela('screen-role');
            carregarBasesIniciais();
        } else {
            alert("Credenciais inválidas!");
            btn.innerText = "Entrar";
        }
    } catch (e) {
        alert("Erro no login. Verifique sua conexão.");
        btn.innerText = "Entrar";
    }
}

function selecionarPerfil(tipo) {
    appState.perfil = tipo;
    document.getElementById('infoUsuario').innerText = `Olá, ${appState.dadosUsuario?.nome || appState.usuario}`;
    mudarTela('screen-menu');
}

// --- CARREGAMENTO DE DADOS ---
async function carregarBasesIniciais() {
    // Carrega MB52 (Para Programada)
    carregarEstoqueMB52();
    // Carrega Usuários e Materiais (Para OSM)
    try {
        const [uRes, mRes] = await Promise.all([fetch(GITHUB_USERS), fetch(GITHUB_MATS)]);
        const uText = await uRes.text();
        const mText = await mRes.text();
        
        appState.db_users = uText.split('\n').slice(1).map(l => {
            const [nome, mat] = l.split(',');
            return { nome: nome?.trim().toUpperCase(), mat: mat?.trim() };
        }).filter(x => x.nome);

        appState.db_mats = mText.split('\n').slice(1).map(l => {
            const [cod, desc] = l.split(',');
            return { cod: cod?.trim(), desc: desc?.trim().toUpperCase() };
        }).filter(x => x.cod);
    } catch(e) { console.error("Erro ao carregar bases CSV"); }
}

async function carregarEstoqueMB52() {
    try {
        const response = await fetch(GITHUB_ESTOQUE + "?t=" + new Date().getTime());
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const range = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
        let idx = range.findIndex(l => l && l.some(c => c?.toString().includes("Material")));
        const dados = XLSX.utils.sheet_to_json(worksheet, { range: idx === -1 ? 0 : idx });
        
        const centroUser = appState.dadosUsuario?.centro?.toString().toUpperCase().trim();
        appState.estoque = dados.map(i => ({
            codigo: i["Material"],
            descricao: i["Texto breve material"],
            saldo: parseFloat(i["Utilização livre"]) || 0,
            unidade: i["Unid.medida básica"],
            deposito: i["Depósito"],
            centro: i["Centro"]?.toString().toUpperCase().trim()
        })).filter(i => i.codigo && (centroUser ? i.centro === centroUser : true));
    } catch (e) { console.error("Erro MB52:", e); }
}

// --- LÓGICA MÓDULO OSM (NOVO PEDIDO) ---
function abrirNovoPedido() { mudarTela('screen-osm'); }

function searchData(mode) {
    const input = document.getElementById(mode === 'mat' ? 'mat_busca' : mode + '_nome');
    const resDiv = document.getElementById(mode + '_results');
    const t = input.value.toUpperCase();
    if (t.length < 2) { resDiv.style.display = 'none'; return; }
    
    let f = (mode === 'mat') 
        ? appState.db_mats.filter(m => m.cod.includes(t) || m.desc.includes(t)) 
        : appState.db_users.filter(u => u.nome.includes(t));
    
    resDiv.innerHTML = f.slice(0, 8).map(x => `
        <div style="padding:10px; border-bottom:1px solid #333; cursor:pointer;" 
             onclick="selectItem('${mode}','${(x.nome || x.cod)}','${(x.mat || x.desc)}')">
            <b>${x.nome || x.cod}</b><br><small>${x.mat || x.desc}</small>
        </div>`).join('');
    resDiv.style.display = f.length ? 'block' : 'none';
}

function selectItem(m, v1, v2) {
    if (m === 'mat') { 
        document.getElementById('mat_busca').value = v1; 
        document.getElementById('mat_desc').innerText = v2; 
    } else { 
        document.getElementById(m + '_nome').value = v1; 
        document.getElementById(m + '_mat').value = v2; 
    }
    document.querySelectorAll('.search-results').forEach(d => d.style.display = 'none');
}

function addItem() {
    const cod = document.getElementById('mat_busca').value;
    const desc = document.getElementById('mat_desc').innerText;
    const qtd = document.getElementById('mat_qtd').value;
    if(!cod || desc === "Nenhum item selecionado") return alert("Selecione um item!");
    
    appState.listaSolicitacao.push({ cod, desc, qtd });
    renderListOSM();
    document.getElementById('mat_busca').value = "";
    document.getElementById('mat_desc').innerText = "Nenhum item selecionado";
}

function renderListOSM() {
    const container = document.getElementById('lista_ui');
    container.innerHTML = appState.listaSolicitacao.map((item, i) => `
        <div class="list-item">
            <b>${item.cod}</b>
            <div>${item.desc}</div>
            <div style="background:var(--primary); color:white; padding:2px 6px; border-radius:4px;">${item.qtd}</div>
            <button onclick="removeItemOSM(${i})" style="background:none; color:red; width:auto; margin:0; padding:5px;">🗑️</button>
        </div>
    `).join('');
}

function removeItemOSM(i) { appState.listaSolicitacao.splice(i, 1); renderListOSM(); }

function confirmarPedido() {
    if(appState.listaSolicitacao.length === 0) return alert("Adicione itens!");
    alert("Pedido registrado com sucesso (Simulação)");
    appState.listaSolicitacao = [];
    mudarTela('screen-menu');
}

// --- LÓGICA MÓDULO PROGRAMADA (ESTOQUE) ---
function abrirProgramada() { mudarTela('screen-programada'); filtrarEstoque(); }

function filtrarEstoque() {
    const termo = document.getElementById('buscaMaterial').value.toLowerCase();
    const lista = document.getElementById('listaProdutos');
    lista.innerHTML = "";
    const filtrados = appState.estoque.filter(i => 
        (i.codigo && i.codigo.toString().toLowerCase().includes(termo)) || 
        (i.descricao && i.descricao.toLowerCase().includes(termo))
    );
    filtrados.slice(0, 50).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-estoque';
        div.innerHTML = `
            <div style="font-weight:bold; color:var(--accent);">${item.codigo}</div>
            <div style="font-size:13px; margin: 4px 0;">${item.descricao}</div>
            <div style="font-size:12px; color:#aaa;">Saldo: <b>${item.saldo}</b> ${item.unidade} | Dep: ${item.deposito}</div>
        `;
        lista.appendChild(div);
    });
}

// Fechar buscas ao clicar fora
document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-results') && !e.target.closest('input')) {
        document.querySelectorAll('.search-results').forEach(d => d.style.display = 'none');
    }
});
</script>
</body>
</html>
