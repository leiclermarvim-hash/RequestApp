<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - V15.9.1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444;
        }
        * { box-sizing:border-box; margin: 0; padding: 0; }
        body {
            font-family:'Segoe UI', sans-serif;
            background:radial-gradient(circle at top,var(--bg1),var(--bg2));
            color:#fff; min-height: 100vh; padding-bottom: 50px;
        }
        .screen { display:none; min-height:100vh; justify-content:center; align-items:center; padding: 20px; flex-direction: column; }
        .screen.active { display:flex; }
        
        .card {
            width:100%; max-width:400px; padding:30px; border-radius:20px;
            background:var(--glass); backdrop-filter: blur(14px); text-align:center;
            box-shadow:0 0 30px rgba(0,255,255,.15); border: 1px solid rgba(255,255,255,0.1);
        }
        
        input, button { width:100%; padding:14px; margin-top:10px; border:none; border-radius:12px; font-size:14px; outline: none; }
        input { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        input:focus { border-color: var(--accent); }
        
        button { background:linear-gradient(135deg,var(--accent),var(--primary)); font-weight:700; cursor:pointer; color:#000; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        
        .form-container { width: 100%; max-width: 550px; background: var(--glass); padding: 20px; border-radius: 15px; backdrop-filter: blur(10px); }
        .section-title { font-size: 11px; color: var(--accent); font-weight: bold; margin: 15px 0 5px 0; text-transform: uppercase; display: block; }
        
        .search-box { position: relative; }
        .search-results { position: absolute; background: #0a0f2c; width: 100%; z-index: 999; border: 1px solid var(--accent); display: none; max-height: 180px; overflow-y: auto; border-radius: 10px; }
        .result-item { padding:12px; border-bottom:1px solid rgba(255,255,255,0.1); cursor:pointer; font-size: 13px; text-align: left; }
        
        .carrinho-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); margin-bottom: 5px; border-radius: 8px; font-size: 12px; }
        .btn-del { background: var(--danger); color: white; width: 30px; padding: 5px; margin: 0; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        footer { position: fixed; bottom: 10px; width: 100%; text-align: center; font-size: 10px; color: rgba(255,255,255,0.4); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN RESTAURADA -->
    <div id="screen-login" class="screen active">
        <div class="card">
            <h1>FAST REQUEST</h1>
            <p style="font-size: 12px; color: var(--accent); margin-bottom: 20px;">CONTROLE DE MATERIAIS MT/BT</p>
            <input id="login_mat" type="text" placeholder="Matrícula">
            <input id="login_pass" type="password" placeholder="Senha">
            <button id="btn_entrar" onclick="executarLogin()">ENTRAR NO SISTEMA</button>
        </div>
    </div>

    <!-- TELA MENU -->
    <div id="screen-menu" class="screen">
        <div class="form-container" style="text-align: center;">
            <h3 id="userGreeting">Olá</h3>
            <p id="userLocation" style="font-size: 12px; color: var(--accent); margin-bottom: 20px;"></p>
            <button onclick="mudarTela('screen-osm')">📋 NOVA REQUISIÇÃO (OSM)</button>
            <button onclick="location.reload()" style="background: transparent; color: var(--danger); margin-top: 20px; border: 1px solid var(--danger);">LOGOUT / SAIR</button>
        </div>
    </div>

    <!-- TELA OSM -->
    <div id="screen-osm" class="screen">
        <div class="form-container">
            <h2 style="color: var(--accent); margin-bottom: 15px; font-size: 18px;">Nova Requisição</h2>
            
            <span class="section-title">Dados da Operação</span>
            <div class="grid-2">
                <input type="text" id="osm_num" placeholder="Nº OSM">
                <input type="text" id="viatura" placeholder="Viatura">
            </div>
            <input type="text" id="encarregado" placeholder="Encarregado">

            <span class="section-title">Pesquisar Material</span>
            <div class="search-box">
                <input type="text" id="busca_sap" placeholder="Cód ou Descrição..." onkeyup="buscarNoEstoque(this.value)">
                <div id="res_busca" class="search-results"></div>
            </div>

            <div id="painel_qtd" style="display:none; margin-top: 10px; padding: 15px; border: 1px solid var(--accent); border-radius: 10px;">
                <p id="label_item" style="font-size: 12px; font-weight: bold;"></p>
                <div class="grid-2" style="margin-top: 10px;">
                    <input type="number" id="input_qtd" placeholder="Qtd">
                    <button onclick="confirmarAdicao()">ADICIONAR</button>
                </div>
            </div>

            <span class="section-title">Itens Selecionados</span>
            <div id="lista_itens" style="margin-bottom: 15px; min-height: 40px;"></div>

            <button id="btn_enviar" onclick="enviarPedido()">FINALIZAR REQUISIÇÃO</button>
            <button onclick="mudarTela('screen-menu')" style="background: transparent; color: #aaa;">VOLTAR</button>
        </div>
    </div>

    <footer>CAMPOS DOS GOYTACAZES - RJ</footer>

<script>
const URL_USUARIOS = "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/refs/heads/main/configuracoes/usuarios.csv";
const URL_MB52 = "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/main/base_dados/MB52.XLSX";

let state = {
    user: null,
    estoqueLocal: [],
    itemTemp: null,
    carrinho: []
};

// 1. LOGIN VIA CSV (Restaurado para destravar o app)
async function executarLogin() {
    const btn = document.getElementById('btn_entrar');
    const mat = document.getElementById('login_mat').value.trim();
    const pass = document.getElementById('login_pass').value.trim();

    if(!mat || !pass) return alert("Preencha todos os campos.");
    
    btn.innerText = "VALIDANDO...";
    btn.disabled = true;

    try {
        const res = await fetch(URL_USUARIOS + "?t=" + new Date().getTime());
        const text = await res.text();
        const linhas = text.split('\n').filter(l => l.trim() !== "");
        const separador = text.includes(';') ? ';' : ',';
        
        const cabecalho = linhas[0].split(separador).map(c => c.trim().toUpperCase());
        const usuarios = linhas.slice(1).map(linha => {
            let colunas = linha.split(separador);
            let obj = {};
            cabecalho.forEach((tit, i) => obj[tit] = colunas[i] ? colunas[i].trim() : "");
            return obj;
        });

        const encontrado = usuarios.find(u => u['MATRICULA'] === mat && u['SENHA'] === pass);

        if (encontrado) {
            state.user = {
                nome: encontrado['NOME'],
                centro: encontrado['CENTRO'],
                matricula: encontrado['MATRICULA']
            };
            
            await carregarEstoque();
            
            document.getElementById('userGreeting').innerText = `Olá, ${state.user.nome}`;
            document.getElementById('userLocation').innerText = `Centro: ${state.user.centro} | Matrícula: ${state.user.matricula}`;
            mudarTela('screen-menu');
        } else {
            alert("Matrícula ou Senha incorreta.");
            btn.innerText = "ENTRAR NO SISTEMA";
            btn.disabled = false;
        }
    } catch (e) { 
        alert("Erro ao acessar base de usuários."); 
        btn.innerText = "ENTRAR NO SISTEMA";
        btn.disabled = false;
    }
}

// 2. CARREGAMENTO MB52 COM FILTRO PELA COLUNA P (CENTRO)
async function carregarEstoque() {
    try {
        const res = await fetch(URL_MB52 + "?t=" + new Date().getTime());
        const ab = await res.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(ab), {type: 'array'});
        const rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

        state.estoqueLocal = rawData.map(i => ({
            sap: i["Material"]?.toString().trim(),
            desc: i["Texto breve material"],
            saldo: parseFloat(i["Utilização livre"]) || 0,
            centro: i["Centro"]?.toString().trim(), // Coluna P do Excel
            un: i["Unid.medida básica"]
        })).filter(i => i.centro === state.user.centro && i.saldo > 0);

    } catch (e) { alert("Erro ao processar estoque MB52."); }
}

// 3. BUSCA E CARRINHO
function buscarNoEstoque(valor) {
    const resDiv = document.getElementById('res_busca');
    resDiv.innerHTML = "";
    if(valor.length < 2) { resDiv.style.display = "none"; return; }

    const filtrados = state.estoqueLocal.filter(i => 
        i.sap.includes(valor) || i.desc.toLowerCase().includes(valor.toLowerCase())
    );

    filtrados.slice(0, 10).forEach(item => {
        const d = document.createElement('div');
        d.className = 'result-item';
        d.innerHTML = `<b>${item.sap}</b> - ${item.desc}<br><small style="color:var(--accent)">Disp: ${item.saldo} ${item.un}</small>`;
        d.onclick = () => {
            state.itemTemp = item;
            document.getElementById('res_busca').style.display = "none";
            document.getElementById('busca_sap').value = item.sap;
            document.getElementById('painel_qtd').style.display = "block";
            document.getElementById('label_item').innerText = `${item.desc}`;
        };
        resDiv.appendChild(d);
    });
    resDiv.style.display = filtrados.length ? "block" : "none";
}

function confirmarAdicao() {
    const qtd = parseFloat(document.getElementById('input_qtd').value);
    if(!qtd || qtd <= 0 || qtd > state.itemTemp.saldo) return alert("Qtd inválida ou acima do saldo.");

    state.carrinho.push({ ...state.itemTemp, qtd_pedida: qtd });
    document.getElementById('painel_qtd').style.display = "none";
    document.getElementById('busca_sap').value = "";
    document.getElementById('input_qtd').value = "";
    renderCarrinho();
}

function renderCarrinho() {
    const container = document.getElementById('lista_itens');
    container.innerHTML = state.carrinho.map((item, index) => `
        <div class="carrinho-item">
            <span>${item.sap} | ${item.qtd_pedida} ${item.un}</span>
            <button class="btn-del" onclick="removerItem(${index})">X</button>
        </div>
    `).join('');
}

function removerItem(idx) {
    state.carrinho.splice(idx, 1);
    renderCarrinho();
}

function enviarPedido() {
    if(state.carrinho.length === 0) return alert("Adicione itens.");
    alert("Requisição pronta para envio!");
    mudarTela('screen-menu');
}

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
</script>
</body>
</html>
