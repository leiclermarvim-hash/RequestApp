<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - MB52 Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444;
        }
        * { box-sizing:border-box; }
        body{
            margin:0; font-family:'Segoe UI',Roboto,sans-serif;
            background:radial-gradient(circle at top,var(--bg1),var(--bg2));
            color:#fff; min-height: 100vh;
        }
        .screen{ display:none; min-height:100vh; justify-content:center; align-items:center; padding: 20px; flex-direction: column; }
        .screen.active{ display:flex; }
        
        .card{
            width:100%; max-width:380px; padding:30px; border-radius:20px;
            background:var(--glass); backdrop-filter: blur(14px); text-align:center;
            box-shadow:0 0 30px rgba(0,255,255,.25); border: 1px solid rgba(255,255,255,0.1);
        }
        
        input, button, select { width:100%; padding:14px; margin-top:10px; border:none; border-radius:12px; font-size:15px; outline: none; }
        input, select { background: rgba(255,255,255,0.1); color: #fff; }
        button{ background:linear-gradient(135deg,var(--accent),var(--primary)); font-weight:700; cursor:pointer; color:#000; }
        
        .menu{ width:100%; max-width:500px; }
        .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        
        .form-section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; }
        .section-title { font-size: 11px; color: var(--accent); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; display: block; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        
        .material-box { border: 2px dashed var(--accent); padding: 15px; border-radius: 12px; background: rgba(0,255,224,0.05); margin-bottom: 15px; position: relative; }
        .search-results { position: absolute; background: #0a0f2c; width: 100%; left: 0; z-index: 999; border: 1px solid var(--accent); display: none; max-height: 200px; overflow-y: auto; border-radius: 10px; }
        .result-item { padding:10px; border-bottom:1px solid rgba(255,255,255,0.1); cursor:pointer; font-size: 13px; }
        .result-item:hover { background: rgba(255,255,255,0.1); }

        .list-item { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 12px; }
        .lista-container { margin-top:10px; max-height:300px; overflow-y:auto; }
        footer{ position:fixed; bottom:10px; width:100%; text-align:center; font-size:11px; color:#aaa; pointer-events: none; }
    </style>
</head>

<body>

    <div id="screen-login" class="screen active">
        <div class="card">
            <h2>FAST REQUEST PRO</h2>
            <input id="login_mat" type="text" placeholder="Matrícula">
            <input id="login_pass" type="password" placeholder="Senha">
            <button id="btn-login" onclick="login()">Entrar</button>
        </div>
    </div>

    <div id="screen-menu" class="screen">
        <div class="menu">
            <h3 id="infoUsuario">Menu Principal</h3>
            <div class="menu-grid">
                <button onclick="mudarTela('screen-osm')">📋 OSM (Pedido)</button>
                <button onclick="mudarTela('screen-programada')">📆 Programada</button>
            </div>
            <button onclick="location.reload()" style="margin-top:20px; background:transparent; border:1px solid var(--danger); color:var(--danger);">Sair</button>
        </div>
    </div>

    <!-- TELA OSM (PEDIDOS BASEADOS NO MB52) -->
    <div id="screen-osm" class="screen">
        <div class="menu">
            <h3>Nova Solicitação</h3>
            <div class="form-section">
                <span class="section-title">Dados Gerais</span>
                <input type="text" id="projeto_osm" placeholder="Nº OSM / Projeto" oninput="this.value=this.value.toUpperCase()">
            </div>

            <div class="material-box">
                <span class="section-title">Adicionar Material (MB52)</span>
                <div style="position:relative">
                    <input type="text" id="busca_mb52_osm" placeholder="Cód. SAP ou Descrição..." onkeyup="buscarNoMB52(this.value, 'osm')">
                    <div id="results_osm" class="search-results"></div>
                </div>
                <div id="detalhe_selecionado" style="margin-top:10px; font-size:12px; color:var(--accent); min-height: 20px;"></div>
                
                <div style="display:flex; gap:10px; margin-top:10px;">
                    <input type="number" id="qtd_osm" placeholder="Qtd" style="flex:1">
                    <button onclick="adicionarItem()" style="flex:2">ADICIONAR</button>
                </div>
            </div>

            <div id="lista_pedido" class="form-section">
                <span class="section-title">Itens do Pedido</span>
                <div id="itens_container"></div>
            </div>

            <button onclick="finalizarPedido()">CONFIRMAR SOLICITAÇÃO</button>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff; margin-top:10px;">Voltar</button>
        </div>
    </div>

    <!-- TELA PROGRAMADA (APENAS CONSULTA MB52) -->
    <div id="screen-programada" class="screen">
        <div class="menu">
            <h3>Consulta de Estoque</h3>
            <input type="text" placeholder="Pesquisar no MB52..." onkeyup="buscarNoMB52(this.value, 'prog')">
            <div id="results_prog" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff; margin-top:20px;">Voltar</button>
        </div>
    </div>

    <footer>FAST REQUEST PRO • v15.6.3</footer>

<script>
const GITHUB_ESTOQUE = "https://raw.githubusercontent.com/leiclermarvim-hash/RequestApp/main/base_dados/MB52.XLSX";
let appState = { 
    estoque: [], 
    itemSelecionado: null,
    listaPedido: [],
    dadosUsuario: null 
};

// LOGIN SIMPLIFICADO (Integre com sua API se necessário)
async function login() {
    const mat = document.getElementById('login_mat').value;
    if(!mat) return alert("Insira a matrícula");
    
    // Simulação de login - aqui você chama seu /api/login
    appState.dadosUsuario = { nome: "Marlei", centro: "3103" }; // Exemplo
    document.getElementById('infoUsuario').innerText = `Olá, ${appState.dadosUsuario.nome}`;
    
    await carregarMB52();
    mudarTela('screen-menu');
}

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// CARREGA MB52 E SALVA NO appState
async function carregarMB52() {
    try {
        const res = await fetch(GITHUB_ESTOQUE + "?t=" + new Date().getTime());
        const data = new Uint8Array(await res.arrayBuffer());
        const workbook = XLSX.read(data, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(sheet, { range: 0 });

        // Normaliza os dados
        appState.estoque = json.map(i => ({
            codigo: i["Material"]?.toString().trim(),
            descricao: i["Texto breve material"],
            saldo: parseFloat(i["Utilização livre"]) || 0,
            centro: i["Centro"]?.toString().trim(),
            deposito: i["Depósito"]
        })).filter(i => i.codigo);
        
        console.log("MB52 Carregado:", appState.estoque.length, "itens");
    } catch (e) { alert("Erro ao carregar MB52 do GitHub"); }
}

// BUSCA UNIFICADA NO MB52
function buscarNoMB52(termo, contexto) {
    const t = termo.toLowerCase();
    const resDiv = document.getElementById(contexto === 'osm' ? 'results_osm' : 'results_prog');
    resDiv.innerHTML = "";
    
    if(t.length < 2) { resDiv.style.display = 'none'; return; }

    const filtrados = appState.estoque.filter(i => 
        i.codigo.includes(t) || i.descricao.toLowerCase().includes(t)
    ).slice(0, 30);

    filtrados.forEach(item => {
        const div = document.createElement('div');
        div.className = contexto === 'osm' ? 'result-item' : 'form-section';
        div.innerHTML = `
            <b>${item.codigo}</b> - ${item.descricao}<br>
            <small>Centro: ${item.centro} | Disponível: <span style="color:var(--accent)">${item.saldo}</span></small>
        `;
        div.onclick = () => selecionarItem(item, contexto);
        resDiv.appendChild(div);
    });
    resDiv.style.display = 'block';
}

function selecionarItem(item, contexto) {
    if(contexto === 'osm') {
        appState.itemSelecionado = item;
        document.getElementById('busca_mb52_osm').value = item.codigo;
        document.getElementById('detalhe_selecionado').innerHTML = 
            `Selecionado: ${item.descricao} | Estoque: ${item.saldo} (${item.centro})`;
        document.getElementById('results_osm').style.display = 'none';
    }
}

function adicionarItem() {
    const item = appState.itemSelecionado;
    const qtd = parseFloat(document.getElementById('qtd_osm').value);

    if(!item) return alert("Selecione um material da lista!");
    if(!qtd || qtd <= 0) return alert("Informe uma quantidade válida!");
    if(qtd > item.saldo) return alert("Quantidade superior ao saldo disponível!");

    appState.listaPedido.push({ ...item, qtd_pedida: qtd });
    
    // Limpar campos
    appState.itemSelecionado = null;
    document.getElementById('busca_mb52_osm').value = "";
    document.getElementById('qtd_osm').value = "";
    document.getElementById('detalhe_selecionado').innerText = "";
    
    renderizarListaPedido();
}

function renderizarListaPedido() {
    const container = document.getElementById('itens_container');
    container.innerHTML = appState.listaPedido.map((item, index) => `
        <div class="list-item">
            <div><b>${item.codigo}</b><br>${item.descricao}</div>
            <div style="color:var(--accent)">Qtd: ${item.qtd_pedida}</div>
            <button onclick="removerItem(${index})" style="background:none; color:red; width:auto; margin:0; padding:5px;">✕</button>
        </div>
    `).join('');
}

function removerItem(index) {
    appState.listaPedido.splice(index, 1);
    renderizarListaPedido();
}

function finalizarPedido() {
    if(appState.listaPedido.length === 0) return alert("Lista vazia!");
    const osm = document.getElementById('projeto_osm').value;
    if(!osm) return alert("Informe o número da OSM ou Projeto");

    alert(`Pedido da OSM ${osm} enviado com sucesso!\n${appState.listaPedido.length} itens registrados.`);
    appState.listaPedido = [];
    renderizarListaPedido();
    mudarTela('screen-menu');
}
</script>
</body>
</html>
