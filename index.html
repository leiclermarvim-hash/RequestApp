<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - V16.2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Biblioteca para processar o Excel MB52 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444;
        }
        * { box-sizing:border-box; transition: all 0.2s ease; }
        body {
            margin:0; font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, var(--bg1), var(--bg2));
            color:#fff; min-height: 100vh;
        }

        /* Estrutura de Telas */
        .screen { display:none; min-height:100vh; flex-direction: column; align-items:center; padding: 20px; }
        .screen.active { display:flex; }

        /* Card de Login */
        .card-login {
            margin-top: 15vh; width:100%; max-width:350px; padding:40px; 
            background:var(--glass); backdrop-filter: blur(15px); border-radius:25px;
            border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Menu Grid */
        .menu-container { width: 100%; max-width: 500px; text-align: center; }
        .menu-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 25px; }

        input, button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:12px; font-size:15px; outline:none; }
        input { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        button { background: linear-gradient(135deg, var(--accent), var(--primary)); font-weight:700; cursor:pointer; color:#000; }

        /* Lista de Estoque */
        .lista-scroll { width: 100%; max-height: 450px; overflow-y: auto; margin-top: 20px; }
        .item-card { 
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; 
            margin-bottom: 12px; border-left: 4px solid var(--accent); text-align: left;
        }

        .user-header { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .badge { font-size: 10px; padding: 4px 10px; border-radius: 6px; font-weight: bold; }
        .badge-perfil { background: var(--accent); color: #000; }
        .badge-centro { background: rgba(255,255,255,0.2); color: #fff; margin-left: 5px; }
    </style>
</head>
<body>

    <!-- TELA: LOGIN -->
    <div id="scr-login" class="screen active">
        <div class="card-login">
            <h2>FAST REQUEST</h2>
            <p style="color:var(--accent); font-size: 11px;">PRO V16.2</p>
            <input id="f_mat" type="text" placeholder="Matrícula">
            <input id="f_pass" type="password" placeholder="Senha">
            <button id="btn-entrar" onclick="handleLogin()">ENTRAR</button>
        </div>
    </div>

    <!-- TELA: MENU PRINCIPAL -->
    <div id="scr-menu" class="screen">
        <div class="menu-container">
            <div class="user-header">
                <h3 id="u_nome" style="margin:0 0 10px 0;"></h3>
                <span id="u_perfil" class="badge badge-perfil"></span>
                <span id="u_centro" class="badge badge-centro"></span>
            </div>
            
            <div id="grid-modulos" class="menu-grid"></div>

            <button onclick="location.reload()" style="background:transparent; color:var(--danger); border:1px solid var(--danger); margin-top:50px;">SAIR</button>
        </div>
    </div>

    <!-- TELA: OPERAÇÃO (OSM/ESTOQUE) -->
    <div id="scr-operacao" class="screen">
        <div class="menu-container">
            <h3 id="mod-titulo">Módulo</h3>
            <input type="text" id="mod-busca" placeholder="Pesquisar no estoque..." oninput="renderizarItens()">
            <div id="mod-lista" class="lista-scroll"></div>
            <button onclick="mudarTela('scr-menu')" style="background:#444; color:#fff; margin-top:20px;">VOLTAR</button>
        </div>
    </div>

<script>
const PATH_MB52 = "base_dados/MB52.XLSX"; 
let state = { user: null, estoqueFiltrado: [] };

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// --- LOGIN COM SUPORTE A JSON E RESPOSTA DA API ---
async function handleLogin() {
    const mat = document.getElementById('f_mat').value.trim();
    const pass = document.getElementById('f_pass').value.trim();
    const btn = document.getElementById('btn-entrar');

    if(!mat || !pass) return alert("Preencha os campos!");
    
    btn.innerText = "CARREGANDO...";
    btn.disabled = true;

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ matricula: mat, senha: pass })
        });

        const data = await res.json();

        if (data.authenticated) {
            state.user = data.user;
            setupMenu();
            await loadEstoque();
            mudarTela('scr-menu');
        } else {
            alert("Credenciais incorretas.");
            btn.innerText = "ENTRAR";
            btn.disabled = false;
        }
    } catch (e) {
        alert("Erro ao conectar com o servidor.");
        btn.innerText = "ENTRAR";
        btn.disabled = false;
    }
}

// --- CONFIGURAÇÃO DO MENU BASEADO NO PERFIL DO CSV ---
function setupMenu() {
    document.getElementById('u_nome').innerText = state.user.nome;
    document.getElementById('u_perfil').innerText = state.user.perfil.toUpperCase();
    document.getElementById('u_centro').innerText = "Centro: " + state.user.centro;

    const grid = document.getElementById('grid-modulos');
    grid.innerHTML = "";

    const perfil = state.user.perfil.toLowerCase();

    // Estrutura de Menus por Perfil
    const menus = {
        solicitante: [
            { txt: "📋 Gerar OSM", act: () => abrirMod("Gerar OSM") },
            { txt: "📆 Gerar Programada", act: () => abrirMod("Gerar Programada") },
            { txt: "🔁 Conversor", act: () => alert("Conversor") },
            { txt: "📂 Solicitações", act: () => alert("Solicitações") }
        ],
        aprovador: [
            { txt: "✅ Aprovar Pedidos", act: () => alert("Aprovações") },
            { txt: "📋 Criar OSM", act: () => abrirMod("Criar OSM") },
            { txt: "📆 Criar Programada", act: () => abrirMod("Criar Programada") }
        ],
        adm: [
            { txt: "📊 Painel Geral", act: () => alert("Dashboard") },
            { txt: "⚙️ Configurações", act: () => alert("Config") }
        ]
    };

    const botoes = menus[perfil] || [];
    botoes.forEach(b => {
        const btn = document.createElement('button');
        btn.innerText = b.txt;
        btn.onclick = b.act;
        grid.appendChild(btn);
    });
}

// --- FILTRO DE ESTOQUE PELO CENTRO DO USUÁRIO ---
async function loadEstoque() {
    try {
        const response = await fetch(PATH_MB52);
        const arrayBuffer = await response.arrayBuffer();
        const workbook = XLSX.read(arrayBuffer, { type: 'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rawJson = XLSX.utils.sheet_to_json(sheet);

        // Filtra o MB52 usando a coluna "Centro" e o Centro do usuário logado
        state.estoqueFiltrado = rawJson.filter(item => {
            return item["Centro"]?.toString().trim() === state.user.centro.toString().trim();
        });
    } catch (e) {
        console.error("Erro ao carregar MB52:", e);
    }
}

function abrirMod(titulo) {
    document.getElementById('mod-titulo').innerText = titulo;
    mudarTela('scr-operacao');
    renderizarItens();
}

function renderizarItens() {
    const busca = document.getElementById('mod-busca').value.toLowerCase();
    const lista = document.getElementById('mod-lista');
    lista.innerHTML = "";

    const filtrados = state.estoqueFiltrado.filter(i => 
        i["Material"]?.toString().toLowerCase().includes(busca) || 
        i["Texto breve material"]?.toLowerCase().includes(busca)
    );

    filtrados.slice(0, 30).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
            <div style="color:var(--accent); font-weight:bold;">${item["Material"]}</div>
            <div style="font-size:13px; margin:5px 0;">${item["Texto breve material"]}</div>
            <div style="font-size:11px; opacity:0.7;">Saldo: ${item["Utilização livre"]} | Dep: ${item["Depósito"]}</div>
        `;
        lista.appendChild(div);
    });
}
</script>
</body>
</html>
