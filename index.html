<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>FAST REQUEST PRO - Hierarchy</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg1:#0a0f2c; --bg2:#020417; --glass:rgba(255,255,255,.08);
            --accent:#00ffe0; --primary:#0066ff; --danger:#ff4444; --warning:#ffcc00;
        }
        * { box-sizing:border-box; }
        body{
            margin:0; font-family:Segoe UI,Roboto,sans-serif;
            background:radial-gradient(circle at top,var(--bg1),var(--bg2));
            color:#fff; overflow-x: hidden;
        }
        .screen{ display:none; min-height:100vh; justify-content:center; align-items:center; padding: 20px; }
        .screen.active{ display:flex; }
        .card{
            width:100%; max-width:380px; padding:30px; border-radius:20px;
            background:var(--glass); backdrop-filter: blur(14px); text-align:center;
            box-shadow:0 0 30px rgba(0,255,255,.25); border: 1px solid rgba(255,255,255,0.1);
        }
        input, button{ width:100%; padding:14px; margin-top:15px; border:none; border-radius:12px; font-size:15px; outline: none; }
        input { background: rgba(255,255,255,0.1); color: #fff; }
        button{ background:linear-gradient(135deg,var(--accent),var(--primary)); font-weight:700; cursor:pointer; color:#000; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        
        .menu{ width:100%; max-width:600px; position: relative; }
        .menu-grid{ display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top: 20px; }
        
        .lista-container { margin-top:20px; max-height:400px; overflow-y:auto; text-align:left; padding-right: 5px; }
        .item-estoque, .item-pedido { 
            padding:12px; background:rgba(255,255,255,0.05); border-radius:10px; 
            margin-bottom:8px; border-left: 4px solid var(--accent);
        }
        
        .badge-perfil {
            font-size: 10px; background: var(--accent); color: #000;
            padding: 2px 8px; border-radius: 10px; display: inline-block; margin-top: 5px;
        }

        footer{ position:fixed; bottom:10px; width:100%; text-align:center; font-size:11px; color:#aaa; pointer-events: none; }
    </style>
</head>

<body>

    <!-- TELA: LOGIN -->
    <div id="screen-login" class="screen active">
        <div class="card">
            <h2>FAST REQUEST PRO</h2>
            <input id="login_mat" type="text" placeholder="Matrícula">
            <input id="login_pass" type="password" placeholder="Senha">
            <button onclick="login()">Entrar</button>
        </div>
    </div>

    <!-- TELA: SELEÇÃO DE PERFIL (HIERARQUIA) -->
    <div id="screen-role" class="screen">
        <div class="card">
            <h3>Nível de Acesso</h3>
            <button onclick="selecionarPerfil('solicitante')">SOLICITANTE (Filho)</button>
            <button onclick="selecionarPerfil('aprovador')" style="background:#fff; color:#000;">APROVADOR (Pai)</button>
            <button onclick="selecionarPerfil('administrador')" style="background:var(--warning); color:#000;">ADMINISTRADOR (Gestor)</button>
        </div>
    </div>

    <!-- TELA: MENU DINÂMICO -->
    <div id="screen-menu" class="screen">
        <div class="menu">
            <div id="cabecalhoUsuario">
                <h3 id="infoUsuario" style="margin-bottom:5px;"></h3>
                <span id="roleLabel" class="badge-perfil"></span>
            </div>
            
            <div id="menuBotoes" class="menu-grid">
                <!-- Botões injetados via JS -->
            </div>
            
            <button onclick="location.reload()" style="margin-top:30px; background:transparent; color:var(--danger); border:1px solid var(--danger);">Sair</button>
        </div>
    </div>

    <!-- TELA: OSM / ESTOQUE -->
    <div id="screen-osm" class="screen">
        <div class="menu">
            <h3 id="tituloOSM">Gerar OSM</h3>
            <input type="text" id="buscaMaterial" placeholder="Buscar material..." oninput="filtrarEstoque()">
            <div id="listaProdutos" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff;">Voltar</button>
        </div>
    </div>

    <!-- TELA: PEDIDOS (VERIFICAÇÃO) -->
    <div id="screen-pedidos" class="screen">
        <div class="menu">
            <h3 id="tituloPedidos">Pedidos</h3>
            <div id="listaPedidosGeral" class="lista-container"></div>
            <button onclick="mudarTela('screen-menu')" style="background:#444; color:#fff;">Voltar</button>
        </div>
    </div>

    <footer>FAST REQUEST PRO • v16.0.0 • GitHub + Vercel</footer>

<script>
let appState = { 
    usuario: "Usuário Teste", 
    perfil: null, 
    estoque: [],
    carrinho: [],
    pedidosSimulados: [
        { id: 101, solicitante: "Matrícula 001", data: "12/05/2026", status: "PENDENTE", itens: 5 },
        { id: 102, solicitante: "Matrícula 002", data: "12/05/2026", status: "APROVADO", itens: 2 }
    ]
};

function mudarTela(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function login() {
    // Simulação de login
    mudarTela('screen-role');
}

function selecionarPerfil(tipo) {
    appState.perfil = tipo;
    const label = document.getElementById('roleLabel');
    const info = document.getElementById('infoUsuario');
    
    info.innerText = `Olá, ${appState.usuario}`;
    label.innerText = tipo.toUpperCase();
    
    configurarMenu(tipo);
    mudarTela('screen-menu');
}

function configurarMenu(perfil) {
    const grid = document.getElementById('menuBotoes');
    grid.innerHTML = ""; // Limpa menu

    const botoes = {
        solicitante: [
            { txt: "🔁 Conversor", cmd: () => alert('Conversor') },
            { txt: "📋 Gerar OSM", cmd: () => abrirOSM('Gerar OSM') },
            { txt: "📆 Gerar Programada", cmd: () => alert('Programada') },
            { txt: "📂 Meus Pedidos", cmd: () => abrirPedidos('Meus Pedidos') }
        ],
        aprovador: [
            { txt: "✅ Pedidos Recebidos", cmd: () => abrirPedidos('Aprovar Pedidos') },
            { txt: "📋 Criar OSM", cmd: () => abrirOSM('Criar OSM') },
            { txt: "📆 Criar Programadas", cmd: () => alert('Criar Programada') }
        ],
        administrador: [
            { txt: "📊 Dashboard Geral", cmd: () => alert('Admin View') },
            { txt: "👥 Gestão Usuários", cmd: () => alert('Usuários') },
            { txt: "⚙️ Configurações", cmd: () => alert('Config') },
            { txt: "📂 Todas Solicitações", cmd: () => abrirPedidos('Gestão Total') }
        ]
    };

    botoes[perfil].forEach(btn => {
        const b = document.createElement('button');
        b.innerText = btn.txt;
        b.onclick = btn.cmd;
        grid.appendChild(b);
    });
}

// LÓGICA DE TELAS ESPECÍFICAS
function abrirOSM(titulo) {
    document.getElementById('tituloOSM').innerText = titulo;
    mudarTela('screen-osm');
    // Aqui viria a carga do estoque...
}

function abrirPedidos(titulo) {
    document.getElementById('tituloPedidos').innerText = titulo;
    const lista = document.getElementById('listaPedidosGeral');
    lista.innerHTML = "";

    appState.pedidosSimulados.forEach(p => {
        const div = document.createElement('div');
        div.className = 'item-pedido';
        div.style.borderLeftColor = p.status === "PENDENTE" ? "var(--warning)" : "var(--accent)";
        
        let acoes = "";
        if (appState.perfil === 'aprovador' && p.status === "PENDENTE") {
            acoes = `
                <div style="margin-top:10px;">
                    <button onclick="decisao(1)" style="width:48%; margin:0; background:var(--accent); padding:5px;">Aprovar</button>
                    <button onclick="decisao(0)" style="width:48%; margin:0; background:var(--danger); padding:5px; color:#fff;">Recusar</button>
                </div>
            `;
        }

        div.innerHTML = `
            <div style="font-size:12px; color:#aaa;">ID: #${p.id} - ${p.data}</div>
            <div style="font-weight:bold;">${p.solicitante}</div>
            <div style="font-size:13px;">Itens: ${p.itens} | Status: <b style="color:var(--accent)">${p.status}</b></div>
            ${acoes}
        `;
        lista.appendChild(div);
    });
    mudarTela('screen-pedidos');
}

function decisao(aprovado) {
    alert(aprovado ? "Pedido Aprovado com sucesso!" : "Pedido Recusado.");
}

function filtrarEstoque() {
    const lista = document.getElementById('listaProdutos');
    lista.innerHTML = "<p style='text-align:center; color:#666;'>Pesquise para ver itens...</p>";
}
</script>
</body>
</html>
